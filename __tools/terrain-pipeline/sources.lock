    only_intersecting: work/boundary/clip.geojson   # fetch only the cells inside the data extent
    tile_range:           # expanded by fetch.py: lat 20..37, lon 59..80 (inclusive)
      lat: [20, 37]
      lon: [59, 80]
    sha256: 81014da257b6c3975ff87847fbea5d08f247aa863cc91dfba7bbcaf369c8860f

