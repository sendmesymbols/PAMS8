<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Export Symbols - Tactical Graphics</title>
    <link href="CSS/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        #symbols-table td.col-name, #symbols-table th.col-name {
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Also constrain Name column by index to cover tbody cells without class */
        #symbols-table th:nth-child(2),
        #symbols-table td:nth-child(2) {
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #symbols-table td {
            font-size: larger;
            font-weight: 600;
        }

        /* Make the SVG/Depiction column wide */
        #symbols-table th:nth-child(5),
        #symbols-table td:nth-child(5) {
            min-width: 520px;
            width: 50%;
        }

        /* Ensure SVG images scale within the wider depiction column */
        #symbols-table td:nth-child(5) img,
        #symbols-table td:nth-child(5) svg {
            max-width: 100%;
            height: 800px;
        }
    </style>
  <script src="JS/jquery.min.js"></script>
  <script src="JS/TacticalGraphics.js"></script>
</head>
<body>
    <div class="container-fluid py-4">
        <h1 class="display-5 fw-semibold text-center mb-4">Tactical Graphic Symbols</h1>
        <h6 class="text-center center mb-4 link-underline">Static Depiction Only</h6>
        <h6 class="text-center center mb-4 link-underline">Refer MIL Std 2525D for further rules including Color, Labeling Rules Modifiers and Amplifiers</h6>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle" id="symbols-table">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" rowspan="2" class="text-nowrap">No</th>
                        <th scope="col" rowspan="2" class="text-nowrap col-name">Name</th>
                        <th scope="col" rowspan="2" class="text-nowrap">SIDC</th>
                        <th scope="col" rowspan="2" class="text-nowrap">Function Code</th>
                        <th scope="col" colspan="1" class="text-center">Symbol Depiction</th>
                    </tr>                    
                </thead>
                <tbody id="symbols-tbody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <div id="marker-container" class="mt-4"></div>
    </div>
    <script src="JS/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
