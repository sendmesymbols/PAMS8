# golden_points.yaml — sanity checks sampled at ZMAX by scripts/validate.py.
#
# EVERY POINT MUST BE VERIFIED AGAINST THE DATA ON FIRST RUN. The coordinates
# were placed from general knowledge, not from the source rasters; a river
# channel or lake shore can easily be a few hundred metres away. `tolerance_px`
# is the half-size of the search window (at ZMAX) in which the expected class
# must occur at least once. Tighten it once the point is confirmed.

points:
  - { name: "Indus near Sukkur (mid-channel)",  lon: 68.8443, lat: 27.6749, expect: water_permanent, tolerance_px: 6 }   # moved 2026-10-31: 68.85,27.70 is inside Sukkur city; here WorldCover=80, JRC occurrence=90, ~780 m from the bank
  - { name: "Lahore centre",                    lon: 74.33,  lat: 31.56,  expect: built_up,        tolerance_px: 3 }   # verify
  - { name: "Karachi centre",                   lon: 67.03,  lat: 24.86,  expect: built_up,        tolerance_px: 3 }   # verify
  - { name: "Thar desert (east of Mithi)",      lon: 70.10,  lat: 24.75,  expect: [bare_desert, sand, dunes, open_land], tolerance_px: 8 }   # verify; hybrid bundles say sand / dunes
  - { name: "K2 / Baltoro glacier",             lon: 76.51,  lat: 35.88,  expect: snow_ice,        tolerance_px: 8 }   # verify
  - { name: "Manchar Lake",                     lon: 67.65,  lat: 26.42,  expect: water_permanent, tolerance_px: 10 }  # verify: seasonal extent varies
  - { name: "Keenjhar Lake",                    lon: 68.05,  lat: 24.95,  expect: water_permanent, tolerance_px: 10 }  # verify
  - { name: "Indus delta mangroves (Keti Bandar)", lon: 67.4277, lat: 24.1610, expect: mangrove, tolerance_px: 12 }  # moved 2026-10-31: 67.45,24.15 is in a tidal creek (100% water); here WorldCover=95 (mangroves)
  - { name: "Punjab irrigated cropland (Okara)", lon: 73.45, lat: 30.75,  expect: cropland,        tolerance_px: 6 }   # verify
  - { name: "Hunza valley slope",               lon: 74.60,  lat: 36.35,  expect: [steep_slope, moderate_slope, rocky_ground], tolerance_px: 8 }   # verify
  - { name: "Tarbela reservoir",                lon: 72.8069, lat: 34.1338, expect: [water_permanent, water_seasonal], tolerance_px: 10 }  # moved 2026-10-31: 72.75,34.20 is on the steep land west of the lake; here WorldCover=80, JRC occurrence=97, ~3 km from shore (188 km2 body)
