    landing: https://esa-worldcover.org/en/data-access        # verify
    # 3°x3° tiles named by their south-west corner. Verify the bucket layout.
    pattern: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif   # verified 2026-10-29: HTTP 200 for every 3-degree tile touching Pakistan's bbox except open-ocean N21E060 / N21E063 (404)
