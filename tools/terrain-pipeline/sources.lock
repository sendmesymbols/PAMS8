# sources.lock — pinned inputs of the terrain bundle.
#
# VERIFY BEFORE FIRST RUN: the `url`/`pattern` values below are the publicly
# documented download layouts at the time of writing, NOT facts checked by this
# repository. Open each `landing` page, confirm the pattern + version, then run
# `make fetch`. `scripts/fetch.py` verifies a file's sha256 when the lock holds
# one and, with `--record`, replaces every `TO_BE_FILLED` with the hash of the
# file it just downloaded. Commit the recorded lock: manifest.json carries these
# hashes so a bundle can be traced back to its inputs.
#
# Entry shape:
#   id, name, version, licence, attribution, landing (human page, "verify"),
#   files: explicit list  — OR —  pattern + tiles (expanded by fetch.py)
#   sha256: per file (TO_BE_FILLED until recorded)

sources:

  - id: worldcover
    name: ESA WorldCover 2021 v200
    version: v200 (2021)
    licence: CC-BY-4.0
    attribution: "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium"
    landing: https://esa-worldcover.org/en/data-access        # verify
    # 3°x3° tiles named by their south-west corner. Verify the bucket layout.
    pattern: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif   # verified 2026-10-29: HTTP 200 for every 3-degree tile touching Pakistan's bbox except open-ocean N21E060 / N21E063 (404)
    allow_missing: true   # ocean-only tiles do not exist on the server; fetch skips 404s
    only_intersecting: work/boundary/clip.geojson   # the data extent (map frame or boundary): tiles outside it are not fetched
    tiles:                # full 3-degree grid; ocean-only tiles 404 and are skipped
