  - id: glo30
    name: Copernicus DEM GLO-30
    version: "2023_1 (verify current release)"
    licence: "Copernicus DEM licence (free, attribution required; see landing page)"
    attribution: "© DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
    landing: https://registry.opendata.aws/copernicus-dem/        # verify
    # 1°x1° COG tiles. {lat}/{lon} are zero-padded N/E codes, e.g. N33 / E073. Verify.
    pattern: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM.tif   # verified 2026-10-29: HTTP 200 (N33_E073)
