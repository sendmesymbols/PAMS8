# classes.yaml — the stable terrain class table and how sources map to it.
# Codes are stable identifiers (never renumber, only append). The `classes`
# block is copied into the bundle's rules.json by scripts/profiles.py, with
# its GROTBC tags:
#   grotbc  the GROTBC heading(s) the class belongs to: G Ground, R Relief, O Obstacles,
#           T Tactical features, B Boundaries & built-up, C Cover & concealment
#   origin  natural | man_made  (reinforcing obstacles come from the plan, not from the bundle)
#   kind    water | gradient | soft_ground | vegetation | structure | snow_ice | restricted |
#           air_hazard | route | crossing | surface
#   note    one plain sentence the card shows under the verdict when the mode has no `why` of its own
# Codes 0-17 are the v1 classes. 18-50 are bundle v2 (GROTBC): slope bands, man-made and linear obstacles,
# roads by load class and the crossings over water (scripts/grotbc.py burns them, classify.py stacks them).

classes:
  - { code: 0,   name: open_land,          label: "Open land",                              grotbc: G,   origin: natural,  kind: surface,     note: "Open, firm ground with low vegetation." }
  - { code: 1,   name: tree_cover,         label: "Tree cover",                             grotbc: GC,  origin: natural,  kind: vegetation,  note: "Trees: good concealment from the air, slow going for vehicles." }
  - { code: 2,   name: cropland,           label: "Cropland",                               grotbc: G,   origin: man_made, kind: surface,     note: "Cultivated fields: firm when dry, soft after irrigation or rain." }
  - { code: 3,   name: built_up,           label: "Built-up area",                          grotbc: BC,  origin: man_made, kind: structure,   note: "Houses and streets: cover and concealment, but movement is channelled." }
  - { code: 4,   name: water_permanent,    label: "Permanent water",                        grotbc: O,   origin: natural,  kind: water,       note: "Water all year round: needs a bridge, ferry or boats to cross." }
  - { code: 5,   name: water_seasonal,     label: "Seasonal water / flood zone",            grotbc: GO,  origin: natural,  kind: water,       note: "Under water for part of the year and soft for the rest." }
  - { code: 6,   name: wetland,            label: "Wetland / marsh",                        grotbc: GO,  origin: natural,  kind: soft_ground, note: "Marsh, reeds or wet mud: vehicles bog down." }
  - { code: 7,   name: mangrove,           label: "Mangrove",                               grotbc: GO,  origin: natural,  kind: soft_ground, note: "Tidal mangrove: mud and roots, impassable to vehicles." }
  - { code: 8,   name: snow_ice,           label: "Snow / ice / glacier",                   grotbc: GO,  origin: natural,  kind: snow_ice,    note: "Snow, ice or glacier: needs over-snow equipment." }
  - { code: 9,   name: steep_slope,        label: "Steep slope (>30°)",                     grotbc: RO,  origin: natural,  kind: gradient,    note: "Slope over 30°: climbable on foot only." }
  - { code: 10,  name: moderate_slope,     label: "Moderate slope (15–30°)",                grotbc: R,   origin: natural,  kind: gradient,    note: "Slope of 15–30°: hard going for vehicles." }
  - { code: 11,  name: restricted,         label: "Restricted / protected area",            grotbc: B,   origin: man_made, kind: restricted,  note: "Military or protected land: entry needs authority." }
  - { code: 12,  name: bare_desert,        label: "Bare / desert",                          grotbc: G,   origin: natural,  kind: surface,     note: "Bare ground with no cover from view." }
  # 13-17 only the NCGDB map sheets distinguish these (WorldCover calls all of them "bare" or cropland).
  - { code: 13,  name: sand,               label: "Sand",                                   grotbc: G,   origin: natural,  kind: soft_ground, note: "Loose sand: wheels sink and dust gives movement away." }
  - { code: 14,  name: dunes,              label: "Sand dunes",                             grotbc: GO,  origin: natural,  kind: soft_ground, note: "Dunes: soft, steep-sided ridges of sand." }
  - { code: 15,  name: rocky_ground,       label: "Rocky ground / scree / stony waste",     grotbc: GC,  origin: natural,  kind: surface,     note: "Rock, scree or stones: hard on tyres and tracks, gives some cover." }
  - { code: 16,  name: salt_pan,           label: "Salt pan",                               grotbc: G,   origin: natural,  kind: soft_ground, note: "Salt crust over soft mud: may not carry a vehicle when wet." }
  - { code: 17,  name: dry_riverbed,       label: "Dry riverbed / nullah",                  grotbc: GO,  origin: natural,  kind: gradient,    note: "Dry bed with banks: floods after rain, gives cover." }
  # 18-50: bundle v2 (GROTBC). The slope bands replace only open land, cropland and bare ground, which every
  # v1 mode treats as GO, so the v1 modes judge that ground as before.
  - { code: 18,  name: gentle_slope,       label: "Gentle slope (3–7°)",                    grotbc: R,   origin: natural,  kind: gradient,    note: "Gentle slope of 3–7°: easy going, but not level enough for a gun platform or a helicopter." }
  - { code: 19,  name: sloping_ground,     label: "Sloping ground (7–15°)",                 grotbc: R,   origin: natural,  kind: gradient,    note: "Sloping ground of 7–15°: fine to move over, too steep to site guns or land helicopters." }
  - { code: 20,  name: canal,              label: "Canal",                                  grotbc: O,   origin: man_made, kind: water,       note: "Main or branch canal: deep, fast and steep-banked; cross at bridges only." }
  - { code: 21,  name: distributary,       label: "Distributary / minor canal",             grotbc: O,   origin: man_made, kind: water,       note: "Distributary or minor canal: narrow but banked; vehicles need a bridge." }
  - { code: 22,  name: drain,              label: "Drain",                                  grotbc: O,   origin: man_made, kind: water,       note: "Drainage channel with soft banks: vehicles need a crossing." }
  - { code: 23,  name: irrigated_cropland, label: "Irrigated cropland (many watercourses)", grotbc: GO,  origin: man_made, kind: water,       note: "Fields cut by watercourses every few hundred metres: wheels slow to a crawl." }
  - { code: 24,  name: embankment_high,    label: "Embankment / bund over 2 m",             grotbc: OC,  origin: man_made, kind: gradient,    note: "Earth bank over 2 m high: stops wheels and gives cover from fire." }
  - { code: 25,  name: bund,               label: "Bund (1–2 m)",                           grotbc: OC,  origin: man_made, kind: gradient,    note: "Low earth bank of 1–2 m: slows wheels and gives some cover." }
  - { code: 26,  name: cutting,            label: "Cutting",                                grotbc: OC,  origin: man_made, kind: gradient,    note: "Road or rail cutting: steep sides, cover from view." }
  - { code: 27,  name: escarpment,         label: "Cliff / escarpment / broken edge",       grotbc: ROC, origin: natural,  kind: gradient,    note: "Cliff or broken edge: a drop no vehicle can take, with cover below it." }
  - { code: 28,  name: railway,            label: "Railway",                                grotbc: TO,  origin: man_made, kind: route,       note: "Railway line on its embankment: vehicles cross at level crossings and bridges." }
  - { code: 29,  name: walled_orchard,     label: "Walled orchard",                         grotbc: OC,  origin: man_made, kind: structure,   note: "Orchard inside a wall: concealment and cover, and a block to vehicles." }
  - { code: 30,  name: orchard,            label: "Orchard / garden",                       grotbc: GC,  origin: man_made, kind: vegetation,  note: "Orchard or garden: good concealment, slow going between the rows." }
  - { code: 31,  name: forest,             label: "Forest (enclosed)",                      grotbc: OC,  origin: natural,  kind: vegetation,  note: "Dense forest: concealment from the air, no way through for wheels." }
  - { code: 32,  name: graveyard,          label: "Graveyard",                              grotbc: BC,  origin: man_made, kind: structure,   note: "Graveyard: walls and mounds give cover, but there is no way through for vehicles." }
  - { code: 33,  name: wire_hazard,        label: "Power line corridor",                    grotbc: O,   origin: man_made, kind: air_hazard,  note: "Within 50–100 m of power lines or masts: a wire-strike risk for helicopters." }
  - { code: 34,  name: road_tankable,      label: "Metalled road, class 60+ (tankable)",    grotbc: T,   origin: man_made, kind: route,       note: "Metalled road of load class 60 or more: carries every main tank." }
  - { code: 35,  name: road_limited,       label: "Metalled road, class 50–59",             grotbc: T,   origin: man_made, kind: route,       note: "Metalled road of load class 50–59: carries Al-Zarrar but not Al-Khalid or T-80UD." }
  - { code: 36,  name: road_light,         label: "Metalled road, below class 50",          grotbc: T,   origin: man_made, kind: route,       note: "Metalled road below load class 50: not tankable." }
  - { code: 37,  name: road_unclassed,     label: "Metalled road, class not recorded",      grotbc: T,   origin: man_made, kind: route,       note: "Metalled road with no load class on record: check its bridges before moving armour." }
  - { code: 38,  name: road_unmetalled,    label: "Unmetalled road",                        grotbc: T,   origin: man_made, kind: route,       note: "Unmetalled or fair-weather road: dust when dry, mud after rain." }
  - { code: 39,  name: bridge_tankable,    label: "Bridge, class 60+ (tankable)",           grotbc: TO,  origin: man_made, kind: crossing,    note: "Bridge of load class 60 or more: carries every main tank." }
  - { code: 40,  name: bridge_limited,     label: "Bridge, class 50–59",                    grotbc: TO,  origin: man_made, kind: crossing,    note: "Bridge of load class 50–59: Al-Zarrar is the only main tank it carries." }
  - { code: 41,  name: bridge_light,       label: "Bridge, below class 50",                 grotbc: TO,  origin: man_made, kind: crossing,    note: "Bridge below load class 50: not for tanks." }
  - { code: 42,  name: bridge_unclassed,   label: "Bridge, class not recorded",             grotbc: TO,  origin: man_made, kind: crossing,    note: "Bridge with no load class on record: confirm it before crossing with armour." }
  - { code: 43,  name: rail_bridge,        label: "Railway bridge",                         grotbc: TO,  origin: man_made, kind: crossing,    note: "Railway bridge: for trains and men on foot, not for vehicles." }
  - { code: 44,  name: foot_bridge,        label: "Foot bridge",                            grotbc: TO,  origin: man_made, kind: crossing,    note: "Foot bridge: a crossing for men on foot only." }
  - { code: 45,  name: ford_ferry,         label: "Ford / ferry",                           grotbc: TO,  origin: man_made, kind: crossing,    note: "Ford or ferry point: a crossing with effort, depending on the water level." }
  - { code: 46,  name: stream_perennial,   label: "Perennial stream / nullah",              grotbc: O,   origin: natural,  kind: water,       note: "Stream or nullah with water all year: banks and a soft bed." }
  - { code: 47,  name: nullah_dry,         label: "Dry nullah",                             grotbc: OC,  origin: natural,  kind: gradient,    note: "Dry nullah: a gully that slows wheels and gives cover." }
  - { code: 48,  name: irrigated_wire,     label: "Irrigated cropland under power lines",   grotbc: GO,  origin: man_made, kind: air_hazard,  note: "Watercourse-cut fields under power lines: slow for wheels and a wire risk for helicopters." }
  - { code: 49,  name: wall_fence,         label: "Wall / fence",                           grotbc: OC,  origin: man_made, kind: structure,   note: "Wall or wire fence: blocks vehicles; a wall gives cover." }
  - { code: 50,  name: level_crossing,     label: "Level crossing",                         grotbc: T,   origin: man_made, kind: crossing,    note: "Road meets railway: the place to cross the line with vehicles." }
  - { code: 255, name: nodata,             label: "No data" }

# When several layers claim a pixel the FIRST entry here wins. The crossing classes (39-45, 50) are not
# painted from evidence: classify.py derives them where a road, railway or crossing point meets water.
precedence:
  - rail_bridge
  - bridge_tankable
  - bridge_limited
  - bridge_light
  - bridge_unclassed
  - foot_bridge
  - ford_ferry
  - level_crossing
  - canal              # above permanent water: OSM's canal buffers otherwise hide the NCGDB canal lines
  - water_permanent
  - mangrove           # above wetland: NCGDB "wet mud" must not overwrite WorldCover's more specific mangrove
  - wetland
  - distributary
  - drain
  - stream_perennial
  - road_tankable      # a road beats everything on land: through a town, a cantonment or a cliff it is the way through
  - road_limited
  - road_light
  - road_unclassed
  - road_unmetalled
  - railway
  - built_up
  - restricted
  - snow_ice
  - escarpment
  - steep_slope
  - embankment_high
  - wall_fence
  - walled_orchard
  - forest
  - graveyard
  - dunes
  - salt_pan
  - water_seasonal
  - dry_riverbed
  - cutting
  - bund
  - moderate_slope
  - rocky_ground
  - nullah_dry
  - orchard
  - tree_cover
  - sand
  - irrigated_wire     # wires over irrigated fields keep both meanings (classify.py)
  - wire_hazard
  - sloping_ground
  - gentle_slope
  - irrigated_cropland
  - cropland
  - bare_desert
  - open_land

sources:
  worldcover:            # ESA WorldCover code -> class name (0 = nodata)
    10: tree_cover
    20: open_land        # shrubland
    30: open_land        # grassland
    40: cropland
    50: built_up
    60: bare_desert
    70: snow_ice
    80: water_permanent
    90: wetland
    95: mangrove
    100: open_land       # moss & lichen
  jrc:                   # Global Surface Water "occurrence" (% of valid observations)
    permanent_min_pct: 80       # >= 80 % -> water_permanent
    seasonal_min_pct: 20        # 20..80 % -> water_seasonal
    flood_prone_min_pct: 5      # 5..20 % -> flood-prone on the wet-season layer (no class of its own)
  slope:                 # degrees, from Copernicus GLO-30
    moderate_deg: 15            # 15..30 -> moderate_slope
    steep_deg: 30               # >= 30  -> steep_slope
    # v2 slope bands, from the slope averaged over 3x3 pixels (~110 m) so DEM noise on the plains
    # does not speckle them; they only replace open land, cropland and bare ground.
    gentle_deg: 3               # 3..7  -> gentle_slope
    sloping_deg: 7              # 7..15 -> sloping_ground
  osm:                   # one uint8 mask per theme, produced by scripts/derive.py
    metric_crs: EPSG:32642      # UTM 42N; buffers are built here (43N is fine too)
    themes:
      water:
        class: water_permanent
        polygons: "natural = 'water' OR other_tags LIKE '%\"water\"=>%'"
        waterways:             # linear features buffered by type (metres)
          river: 40
          canal: 15
          stream: 5
      wetland:
        class: wetland
        polygons: "natural = 'wetland'"
      restricted:
        class: restricted
        polygons: "landuse = 'military' OR military IS NOT NULL OR (boundary = 'protected_area')"
      built_up:
        class: built_up
        polygons: "landuse IN ('residential','industrial','commercial')"

  # NCGDB: Survey-of-Pakistan style 1:50k topographic geodatabase (local, NOT downloaded). Each rule burns
  # `class` wherever <layer>.<field> is one of `values`; `exclude` values of the same layer cut holes in
  # that rule (cultivation exclusions, river islands). Field values are the geodatabase's coded values:
  #   Cultivation 1 exclusion, 2 with limit, 3 without limit, 4 salt pan
  #   Wooded 3 betel / vine trellis, 4 green area, 6 orchard unwalled, 7 orchard walled, 8 palm fill,
  #          10 tea garden, 11 vegetable garden, 12 forest open, 13 forest enclosed (9 sugarcane: none mapped)
  #   Soil 1 boulders, 2 broken rocky, 3 sand, 4 sand hill tail, 5 sand on elevation, 6 scree, 7 stony waste,
  #        8 transitional dune, 9 transverse dune, 10 moraine, 11 rock outcrop, 12 dune area
  #   Reservoir 1 dam non-perennial, 2 dam perennial, 3 lake non-perennial, 4 lake perennial,
  #             5 pond non-perennial, 6 pond perennial, 7 fish farm
  #   Water feature 1 reeds, 2 tank non-perennial, 3 tank perennial, 4 wet mud
  #   River 1 nullah non-perennial, 2 dry bed random, 3 ocean, 4 river limit, 5 nullah perennial, 6 dry bed,
  #         7 river filling, 8 nullah approximate, 9 island, 10 dry bed perennial, 11 canal perennial,
  #         12 canal non-perennial
  # Measured against WorldCover 2021 (see README "Hybrid data"): cultivation, sand, glacier polygons and the
  # linework agree well; NCGDB under-maps built-up land and snow fields and has no polygon forests, so those
  # still come from WorldCover and the two are unioned by precedence.
  ncgdb:
    path: 'E:\LandUse\NCGDB Ver-6.gdb'          # override: --ncgdb, $NCGDB_PATH, run script -Ncgdb; "none" = open data only
    licence: "Restricted - owner's terms apply; confirm before redistributing a bundle built from it"
    attribution: "Survey of Pakistan topographic data (NCGDB Ver-6) - local dataset, not redistributable by default"
    rules:
      - { class: built_up,        layer: Builtup_Area,          field: Type_of_BUA,                  values: ["3"], all_touched: true }
      - { class: cropland,        layer: Cultivation,           field: Type_of_Cultivation,          values: ["2", "3"], exclude: ["1"] }
      - { class: salt_pan,        layer: Cultivation,           field: Type_of_Cultivation,          values: ["4"] }
      - { class: tree_cover,      layer: Wooded_Area,           field: Type_of_Wooded_Area,          values: ["1", "2", "4", "5", "12"] }
      - { class: orchard,         layer: Wooded_Area,           field: Type_of_Wooded_Area,          values: ["3", "6", "8", "10"] }
      - { class: walled_orchard,  layer: Wooded_Area,           field: Type_of_Wooded_Area,          values: ["7"], all_touched: true }
      - { class: forest,          layer: Wooded_Area,           field: Type_of_Wooded_Area,          values: ["13"] }
      - { class: cropland,        layer: Wooded_Area,           field: Type_of_Wooded_Area,          values: ["9", "11"] }
      - { class: graveyard,       layer: Graveyard,             field: Tye_of_Graveyard,             values: ["2"], all_touched: true }
      - { class: snow_ice,        layer: Glacier_Polygon,       field: Type_of_Glacier,              values: ["1", "2"] }
      - { class: water_permanent, layer: Reservior,             field: Type_of_Reservoir,            values: ["2", "4", "6", "7"] }
      - { class: water_seasonal,  layer: Reservior,             field: Type_of_Reservoir,            values: ["1", "3", "5"] }
      - { class: water_permanent, layer: Water_Feature_Polygon, field: Type_of_Water_Feature_Polygon, values: ["3"] }
      - { class: water_seasonal,  layer: Water_Feature_Polygon, field: Type_of_Water_Feature_Polygon, values: ["2"] }
      - { class: wetland,         layer: Water_Feature_Polygon, field: Type_of_Water_Feature_Polygon, values: ["1", "4"] }
      - { class: water_permanent, layer: Sea,                   field: Type_of_Sea,                  values: ["1", "3"], exclude: ["2"] }
      - { class: water_permanent, layer: River,                 field: TYPE_OF_RIVER,                values: ["3", "5", "7"], exclude: ["9"] }
      - { class: canal,           layer: River,                 field: TYPE_OF_RIVER,                values: ["11", "12"], exclude: ["9"] }
      - { class: dry_riverbed,    layer: River,                 field: TYPE_OF_RIVER,                values: ["1", "2", "6", "8", "10"], exclude: ["9"] }
      - { class: sand,            layer: Soil_Area,             field: Type_of_Soil_Area,            values: ["3", "4", "5"] }
      - { class: dunes,           layer: Soil_Area,             field: Type_of_Soil_Area,            values: ["8", "9", "12"] }
      - { class: rocky_ground,    layer: Soil_Area,             field: Type_of_Soil_Area,            values: ["1", "2", "6", "7", "10", "11"] }

  # GROTBC (bundle v2): the NCGDB's lines and points, burned onto the grid by scripts/grotbc.py.
  # Lines are burned as connected 1-px paths (all_touched); `buffer_m` widens a rule to a half-width in
  # metres. Coded values come from the geodatabase's domains (Canal, Embankment, WaterFeatureLine, ...).
  grotbc:
    obstacles:             # -> work/grotbc/obst.tif: class code per pixel, highest precedence wins
      - { class: canal,            layer: Canal,              field: Type_of_Canal,              values: ["3", "4", "5", "7", "8"] }    # canal single / double, perennial or not
      - { class: distributary,     layer: Canal,              field: Type_of_Canal,              values: ["11", "14"] }                 # distributary, minor
      - { class: drain,            layer: Canal,              field: Type_of_Canal,              values: ["12", "13"] }
      - { class: canal,            layer: Canal_Pakmap,       field: TYPE_OF_CA,                 values: ["Canal", "MainCanal"] }
      - { class: distributary,     layer: Canal_Pakmap,       field: TYPE_OF_CA,                 values: ["Disty", "Minor"] }
      - { class: drain,            layer: Canal_Pakmap,       field: TYPE_OF_CA,                 values: ["Drain"] }
      - { class: stream_perennial, layer: Water_Feature_Line, field: Type_of_Water_Feature_Line, values: ["10", "11", "15", "18", "19"] }  # rapids, perennial streams / nullahs
      - { class: nullah_dry,       layer: Water_Feature_Line, field: Type_of_Water_Feature_Line, values: ["1", "4", "14", "21"] }          # broken / dry nullah, non-perennial streams
      - { class: embankment_high,  layer: Embankment,         field: Type_of_Embankment,         values: ["4", "5", "6", "7", "12"] }      # dams, double earthwork / masonry, protective > 2 m
      - { class: bund,             layer: Embankment,         field: Type_of_Embankment,         values: ["8", "9", "11"] }                # single earthwork / masonry, protective 1-2 m
      - { class: cutting,          layer: Embankment,         field: Type_of_Embankment,         values: ["3"] }
      - { class: escarpment,       layer: Embankment,         field: Type_of_Embankment,         values: ["1", "2"] }                      # broken edge
      - { class: escarpment,       layer: Contour,            field: Type_of_Contour,            values: ["4", "7", "8", "9", "27", "28", "29", "30", "31"] }  # cliffs
      - { class: wall_fence,       layer: Boundry,            field: TYPE_OF_BDRY,               values: ["19", "20", "23"] }              # fence wire, wall
    wires:                 # -> wire.tif: helicopter wire-strike risk
      - { layer: Service_Line,   field: Type_of_Svc_line,   values: ["7"],             buffer_m: 100 }   # power line, main
      - { layer: Service_Line,   field: Type_of_Svc_line,   values: ["5", "6"],        buffer_m: 50 }    # power line
      - { layer: Services_Point, field: Type_of__Svc_Point, values: ["3", "61", "77"], buffer_m: 100 }   # tall mast, wind tower, mast
    crossings:             # -> xing.tif: 1 bridge, 2 foot bridge, 3 ford / ferry (classify.py keeps them only on water)
      - { kind: 1, layer: Crossings_Point, field: Type_of_Crossing, values: ["2", "7", "12", "14"], buffer_m: 40 }  # bridge, iron bridge, viaduct
      - { kind: 2, layer: Crossings_Point, field: Type_of_Crossing, values: ["6"],                   buffer_m: 40 }  # foot bridge
      - { kind: 1, layer: Crosings_line,   field: Type_of_Crossing, values: ["1", "2", "3", "6", "9", "10"] }       # bridges, boat bridges
      - { kind: 3, layer: Crosings_line,   field: Type_of_Crossing, values: ["4", "5"] }                             # ferry, ford
      - { kind: 3, layer: Tracks,          field: Type_of_Track,    values: ["6"] }                                  # ford
    watercourses:          # field channels: cropland where they are dense becomes irrigated_cropland
      layer: Canal
      field: Type_of_Canal
      values: ["10"]
      window_m: 600              # averaging window
      min_fraction: 0.10         # share of pixels a channel crosses inside the window: about one every 400 m (11 % of the cropland around Lahore)
    vegetation:            # 1:50k vegetation symbols -> concealment density (weights per symbol)
      layer: Vegetations
      field: Type_of_Vegetation
      window_m: 300
      weights: { "1": 1.0, "3": 0.5, "5": 0.6, "6": 0.6, "7": 0.6, "9": 1.0, "10": 0.8, "11": 0.5, "13": 0.6,
                 "15": 0.3, "16": 0.8, "17": 0.4, "18": 0.4, "19": 1.0 }

# Codebooks of the v2 auxiliary layers (copied into rules.json `grotbc.layers`, read by the engine).
layers:
  route:                   # bit 7 MSR, bits 5-6 load-class tier, bits 0-4 route type (bigger = more important)
    tiers: { "0": "Class not recorded", "1": "Below class 50", "2": "Class 50–59", "3": "Class 60+ (tankable)" }
    types:
      "1": Footpath
      "2": Pack track
      "3": Track along a bed
      "4": Glacier track
      "5": Ropeway
      "6": Ford
      "7": Cart track
      "8": Tramway
      "9": Railway under construction
      "10": Railway tunnel
      "11": Railway, other gauge
      "12": Railway, broad gauge single
      "13": Railway, broad gauge double
      "14": Street
      "15": Shingled road
      "16": Unmetalled road
      "17": Metalled road, local
      "18": Metalled road
      "19": Main road
      "20": Highway
      "21": Motorway
      "22": Road tunnel
