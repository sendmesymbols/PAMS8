<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title>TPK</title>
    <link rel="stylesheet" href="http://devbox:9632/3.15/esri/css/esri.css">
    <style>
        html,
        body,
        #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

    </style>
    
    <script src="http://devbox:9632/3.15/init.js"></script>
    <script>
        var map, mi, layer;

        require([
            "esri/map", 
            "dojo/on", "esri/geometry/Point",
            "esri/symbols/SimpleMarkerSymbol", "esri/graphic",
            "dojo/_base/array", "dojo/dom-style",
            "esri/layers/MapImageLayer", "esri/layers/MapImage",
            "esri/layers/ArcGISTiledMapServiceLayer",
            "esri/layers/ArcGISDynamicMapServiceLayer",
            "esri/geometry/Extent",
            "./offline-tpk-src.js",
            "dojo/domReady!"
        ], function (
            Map, on, Point,
            SimpleMarkerSymbol, Graphic,
            arrayUtils, domStyle,  MapImageLayer, MapImage, ArcGISTiledMapServiceLayer, 
            ArcGISDynamicMapServiceLayer, Extent
        ) {

            map = new Map("map");

            //var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/MapDataNDU/MapServer");

            var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/BaseMaps/Blue_TopoMap/MapServer");

            
            
            //var tiled = new ArcGISDynamicMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/SampleWorldCities/MapServer");

            map.addLayer(tiled);
            tiled.setOpacity(0.1);

            

            map.on("click", function (e) {








            });


            document.getElementById('file-input').addEventListener('change', readSingleFile, false);
            function readSingleFile(e) {
                
                zipParser(e.target.files[0]);
            }

            
             // Parse the zip file contents into a zip.Entries object
                function zipParser(blob){

                    O.esri.zip.createReader(new O.esri.zip.BlobReader(blob), function (zipReader) {
                        zipReader.getEntries(function (entries) {
                            initMap(entries);
                            //if(entries)alert("TPK downloaded and unzipped!");
                            zipReader.close(function(evt){
                                console.log("Done reading zip file.")
                            })
                        }, function (err) {
                            alert("There was a problem reading the file!: " + err);
                        })
                    })
                }


                // Initialize the Map and the TPKLayer
                function initMap(entries){
                    var tpkLayer = new O.esri.TPK.TPKLayer();
                    tpkLayer.id = "TPK";
                    tpkLayer.on("progress", function (evt) {
                        console.log("TPK loading...");
                    })

                    tpkLayer.on("end", function (evt) {
                        console.log("TPK loading ended");
                    })

                    tpkLayer.on("databaseErrorEvent", function (evt) {
                        console.log("databaseErrorEvent");
                    })


                    tpkLayer.on("validationEvent", function (evt) {
                        console.log("validationEvent");
                    })


                    tpkLayer.extend(entries);

                    map.addLayer(tpkLayer);

                }

            
            
        });
    </script>
</head>

<body class="claro">
<input type="file" id="file-input" accept="application/zip"/>
<h3>Contents of the file:</h3>
<div id="map"></div>
</body>
</html>
