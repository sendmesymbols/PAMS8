<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8 />
<title>JS Bin</title>
<script>
  function circle() {
          var canvas = document.getElementById("myc");
          var ctx = canvas.getContext("2d");
          var step = 2*Math.PI / 20;  // see note 1
          var h = 250; 
          var k = 250;
          var r = 80;

          ctx.beginPath();  //tell canvas to start a set of lines

          for(var theta=0;  theta < 2 * Math.PI;  theta+=step)  { 
            var x = h + r*Math.cos(theta);
            var y = k - r*Math.sin(theta);    //note 2.
            ctx.lineTo(x,y);
          }

          ctx.closePath();     //close the end to the start point
          ctx.stroke();        //actually draw the accumulated lines
//Center to bottom right corner         
//line(h, k, h + r, k+r, ctx);
//Bottom right to top right
//line(h+r, k+r, h + r, k - r, ctx);    
//top right to top left
//line(h + r, k - r, h - r, k - r, ctx);    
//top left to bottom left
//line(h - r, k - r, h - r, k + r, ctx);    
//bottom left to bottom right
//line(h - r, k + r, h + r, k + r, ctx);
    
    
    
//Canvas.SetLeft(myRect, centerPoint.X - myRect.Width/2);
//Canvas.SetTop(myRect, centerPoint.Y - myRect.Height/2)
//line(h+r, k+r, h - r, k - r, ctx);    

    //Create B
    line(h - r, k - r, h - r, k + r, ctx);
    circle2(h - 30 / 2, k - 30, 30, ctx);
    
    
    
    
    
 
    
 //rect(h - r, k -r, r * 2, r *2, ctx);  
    
    
 point(100,100,ctx);
 line(0,0,150,100, ctx); 
    
  }
    
function point(x, y, ctx){
  ctx.beginPath();
  ctx.arc(x, y, 1, 0, 2 * Math.PI, true);
  ctx.fill();
}
    
    
 function line(x, y, x1, y1, canvas){
  canvas.beginPath();
  canvas.moveTo(x, y);
  canvas.lineTo(x1, y1);
  canvas.stroke();
}
    
function rect(x, y, h,w, canvas){
  canvas.strokeRect(x,y,h,w);
}

    function circle2(x, y, r, ctx) {
          
          var step = 2*Math.PI / 20;  // see note 1
          var h = x; 
          var k = y;
          var r = r;

          ctx.beginPath();  //tell canvas to start a set of lines

          for(var theta=0;  theta < 2 * Math.PI;  theta+=step)  { 
            var x = h + r*Math.cos(theta);
            var y = k - r*Math.sin(theta);    //note 2.
            ctx.lineTo(x,y);
          }
       ctx.stroke();
    }

    

    
    
    
    
  </script>
  
</head>
<body onload="circle()">
  <canvas id="myc" width="600" height="600" style="border: 1px solid red;"> </canvas>
  

</body>
</html>
