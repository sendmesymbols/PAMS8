<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Symbology Web Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: #2d2d2d;
            border-right: 1px solid #444;
            overflow-y: auto;
            padding: 20px;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .symbol-palette {
            margin-bottom: 25px;
        }

        .symbol-palette h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .symbol-item {
            background: #3d3d3d;
            border: 2px solid #555;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
            transition: all 0.3s ease;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .symbol-item:hover {
            border-color: #4CAF50;
            background: #4a4a4a;
        }

        .symbol-item.selected {
            border-color: #ff6b6b;
            background: #4a2c2c;
        }

        .symbol-svg {
            width: 35px;
            height: 35px;
            margin-bottom: 5px;
        }

        .symbol-label {
            font-size: 10px;
            color: #ccc;
            text-align: center;
        }

        .toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(45, 45, 45, 0.95);
            padding: 15px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
        }

        .tool-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 2px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.3s ease;
        }

        .tool-btn:hover {
            background: #45a049;
        }

        .tool-btn.active {
            background: #ff6b6b;
        }

        .coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(45, 45, 45, 0.95);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .status-bar {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(45, 45, 45, 0.95);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <div class="symbol-palette">
            <h3>Ground Forces</h3>
            <div class="symbol-grid" id="ground-symbols">
                <!-- Symbols will be generated here -->
            </div>
        </div>

        <div class="symbol-palette">
            <h3>Air Forces</h3>
            <div class="symbol-grid" id="air-symbols">
                <!-- Symbols will be generated here -->
            </div>
        </div>

        <div class="symbol-palette">
            <h3>Naval Forces</h3>
            <div class="symbol-grid" id="naval-symbols">
                <!-- Symbols will be generated here -->
            </div>
        </div>

        <div class="symbol-palette">
            <h3>Control Measures</h3>
            <div class="symbol-grid" id="control-symbols">
                <!-- Symbols will be generated here -->
            </div>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>

        <div class="toolbar">
            <button class="tool-btn active" id="place-tool">Place Symbol</button>
            <button class="tool-btn" id="select-tool">Select</button>
            <button class="tool-btn" id="measure-tool">Measure</button>
            <button class="tool-btn" id="clear-tool">Clear All</button>
        </div>

        <div class="coordinates" id="coordinates">
            Lat: 0.00000°, Lng: 0.00000°<br>
            MGRS: --
        </div>

        <div class="status-bar" id="status">
            Ready - Click a symbol and place on map
        </div>
    </div>
</div>

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/milsymbol/2.0.0/milsymbol.js"></script>

<script>
    // Application State
    let map;
    let selectedSymbol = null;
    let placedSymbols = [];
    let currentTool = 'place';

    // Military Symbol Definitions (MIL-STD-2525C)
    const symbolDefinitions = {
        ground: [
            { code: '10031000000000000000', name: 'Infantry' },
            { code: '10032000000000000000', name: 'Armor' },
            { code: '10033000000000000000', name: 'Artillery' },
            { code: '10034000000000000000', name: 'Engineer' },
            { code: '10035000000000000000', name: 'Signal' },
            { code: '10036000000000000000', name: 'Support' },
            { code: '10037000000000000000', name: 'Medical' },
            { code: '10038000000000000000', name: 'Military Police' }
        ],
        air: [
            { code: '10041000000000000000', name: 'Fixed Wing' },
            { code: '10042000000000000000', name: 'Rotary Wing' },
            { code: '10043000000000000000', name: 'UAV' },
            { code: '10044000000000000000', name: 'Fighter' },
            { code: '10045000000000000000', name: 'Bomber' },
            { code: '10046000000000000000', name: 'Transport' },
            { code: '10047000000000000000', name: 'Reconnaissance' },
            { code: '10048000000000000000', name: 'Electronic Warfare' }
        ],
        naval: [
            { code: '10051000000000000000', name: 'Surface Ship' },
            { code: '10052000000000000000', name: 'Submarine' },
            { code: '10053000000000000000', name: 'Carrier' },
            { code: '10054000000000000000', name: 'Destroyer' },
            { code: '10055000000000000000', name: 'Frigate' },
            { code: '10056000000000000000', name: 'Patrol Craft' },
            { code: '10057000000000000000', name: 'Amphibious' },
            { code: '10058000000000000000', name: 'Mine Warfare' }
        ],
        control: [
            { code: '25040000000000000000', name: 'Assembly Area' },
            { code: '25041000000000000000', name: 'Checkpoint' },
            { code: '25042000000000000000', name: 'Contact Point' },
            { code: '25043000000000000000', name: 'Decision Point' },
            { code: '25044000000000000000', name: 'Link Up Point' },
            { code: '25045000000000000000', name: 'Passage Point' },
            { code: '25046000000000000000', name: 'Rally Point' },
            { code: '25047000000000000000', name: 'Release Point' }
        ]
    };

    // Initialize Application
    function initApp() {
        initMap();
        initSymbolPalette();
        initToolbar();
        initEventHandlers();
        updateStatus('Application initialized - Ready for operations');
    }

    // Initialize Map
    function initMap() {
        map = L.map('map', {
            center: [38.9072, -77.0369], // Washington DC
            zoom: 10,
            zoomControl: false
        });

        // Add MGRS Grid (simplified)
        L.control.scale({
            metric: true,
            imperial: true,
            position: 'bottomleft'
        }).addTo(map);

        // Add zoom control to top left
        L.control.zoom({
            position: 'topleft'
        }).addTo(map);

        // Multiple base layers
        const baseLayers = {
            'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }),
            'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri, Maxar, GeoEye, Earthstar Geographics'
            }),
            'Terrain': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap'
            })
        };

        baseLayers['OpenStreetMap'].addTo(map);
        L.control.layers(baseLayers).addTo(map);

        // Mouse coordinate tracking
        map.on('mousemove', updateCoordinates);
        map.on('click', handleMapClick);
    }

    // Initialize Symbol Palette
    function initSymbolPalette() {
        Object.keys(symbolDefinitions).forEach(category => {
            const container = document.getElementById(`${category}-symbols`);
            symbolDefinitions[category].forEach(symbol => {
                const symbolElement = createSymbolElement(symbol);
                container.appendChild(symbolElement);
            });
        });
    }

    // Create Symbol Element
    function createSymbolElement(symbolDef) {
        const div = document.createElement('div');
        div.className = 'symbol-item';
        div.dataset.code = symbolDef.code;

        try {
            // Generate symbol using milsymbol library
            const symbol = new ms.Symbol(symbolDef.code, { size: 35 });
            const svg = symbol.asSVG();

            div.innerHTML = `
                    <div class="symbol-svg">${svg}</div>
                    <div class="symbol-label">${symbolDef.name}</div>
                `;
        } catch (error) {
            // Fallback for unsupported symbols
            div.innerHTML = `
                    <div class="symbol-svg">⬜</div>
                    <div class="symbol-label">${symbolDef.name}</div>
                `;
        }

        div.addEventListener('click', () => selectSymbol(symbolDef));
        return div;
    }

    // Select Symbol
    function selectSymbol(symbolDef) {
        // Remove previous selection
        document.querySelectorAll('.symbol-item').forEach(item => {
            item.classList.remove('selected');
        });

        // Select new symbol
        event.target.closest('.symbol-item').classList.add('selected');
        selectedSymbol = symbolDef;
        updateStatus(`Selected: ${symbolDef.name} - Click on map to place`);
    }

    // Initialize Toolbar
    function initToolbar() {
        document.getElementById('place-tool').addEventListener('click', () => setTool('place'));
        document.getElementById('select-tool').addEventListener('click', () => setTool('select'));
        document.getElementById('measure-tool').addEventListener('click', () => setTool('measure'));
        document.getElementById('clear-tool').addEventListener('click', clearAllSymbols);
    }

    // Set Active Tool
    function setTool(toolName) {
        currentTool = toolName;
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(`${toolName}-tool`).classList.add('active');

        map.getContainer().style.cursor = toolName === 'place' ? 'crosshair' : 'grab';
        updateStatus(`Tool: ${toolName.toUpperCase()}`);
    }

    // Handle Map Click
    function handleMapClick(e) {
        if (currentTool === 'place' && selectedSymbol) {
            placeSymbol(e.latlng, selectedSymbol);
        }
    }

    // Place Symbol on Map
    function placeSymbol(latlng, symbolDef) {
        try {
            const symbol = new ms.Symbol(symbolDef.code, {
                size: 30,
                quantity: Math.floor(Math.random() * 999) + 1 // Random unit size
            });
            const svg = symbol.asSVG();

            const marker = L.marker(latlng, {
                icon: L.divIcon({
                    html: svg,
                    className: 'military-symbol',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                })
            }).addTo(map);

            marker.bindPopup(`
                    <strong>${symbolDef.name}</strong><br>
                    Lat: ${latlng.lat.toFixed(6)}<br>
                    Lng: ${latlng.lng.toFixed(6)}<br>
                    Code: ${symbolDef.code}
                `);

            placedSymbols.push({ marker, symbolDef, latlng });
            updateStatus(`Placed ${symbolDef.name} at ${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`);
        } catch (error) {
            updateStatus(`Error placing symbol: ${error.message}`);
        }
    }

    // Clear All Symbols
    function clearAllSymbols() {
        placedSymbols.forEach(item => {
            map.removeLayer(item.marker);
        });
        placedSymbols = [];
        updateStatus('All symbols cleared');
    }

    // Update Coordinates Display
    function updateCoordinates(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        // Simplified MGRS display (would need proper library for accurate conversion)
        const mgrs = `${Math.floor(Math.abs(lat))}${String.fromCharCode(65 + Math.floor(Math.abs(lng)) % 26)} ${Math.floor(Math.abs(lat * 100000) % 100000)} ${Math.floor(Math.abs(lng * 100000) % 100000)}`;

        document.getElementById('coordinates').innerHTML = `
                Lat: ${lat}°, Lng: ${lng}°<br>
                MGRS: ${mgrs}
            `;
    }

    // Update Status
    function updateStatus(message) {
        document.getElementById('status').textContent = message;
    }

    // Initialize Event Handlers
    function initEventHandlers() {
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'p':
                case 'P':
                    setTool('place');
                    break;
                case 's':
                case 'S':
                    setTool('select');
                    break;
                case 'm':
                case 'M':
                    setTool('measure');
                    break;
                case 'c':
                case 'C':
                    if (e.ctrlKey) clearAllSymbols();
                    break;
                case 'Escape':
                    selectedSymbol = null;
                    document.querySelectorAll('.symbol-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                    updateStatus('Selection cleared');
                    break;
            }
        });
    }

    // Initialize application when page loads
    document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
