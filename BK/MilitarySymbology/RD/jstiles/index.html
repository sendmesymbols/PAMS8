<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title></title>

    <link rel="stylesheet" href="http://devbox:9632/3.15/esri/css/esri.css">
    <!--
    <link href='http://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
  -->
    <script>
      var dojoConfig = {
        paths: {
          plugins: location.pathname.replace(/\/[^/]+$/, "") + "/plugins",
          queue: "http://devbox:9632/MilitarySymbology/RD/jstiles/queue.v1.min"
        }
      };
    </script>

    <style>
      html,body {
        width:100%;
        height:100%;
        margin: 0;
        padding: 0px 0 0 0;
        font-family: 'Open Sans', sans-serif;
      }

      #mapCanvas {
        padding:0;
      }

    </style>

    <script src="http://devbox:9632/MilitarySymbology/RD/jstiles/queue.v1.min.js"></script>
    <script src="http://devbox:9632/3.15/init.js"></script>
    <script>
      var map, rasterLayer;
      var canvasSupport;

      require([
        "esri/map",
        "esri/layers/ArcGISTiledMapServiceLayer",
        "esri/layers/ArcGISDynamicMapServiceLayer", 
        "dojo/dom",
        "plugins/TileCubeLayer",
        "plugins/CanvasTileLayer",
        "dojo/domReady!"
      ], function(
        Map, ArcGISTiledMapServiceLayer,ArcGISDynamicMapServiceLayer,
        dom, 
        TileCubeLayer, CanvasTileLayer
      ){
        // does the browser support canvas? 
        canvasSupport = supports_canvas();
        
        map = new Map("mapCanvas", {
          center: [-99.076, 38.132]
        });

        /*
        var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/MapData/MapServer");
        map.addLayer(tiled);
        */

        var tiled = new ArcGISDynamicMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/SampleWorldCities/MapServer");
        //map.addLayer(tiled);
        tiled.setOpacity(0.3);

        layer = new TileCubeLayer('tiles/{level}/{col}/{row}.json', {
              tileType: 'canvas',
              hidpi: true, 
              temporal: false,
              style: function (val) {
                return {
                  radius: val
                }; 
              }
            });
            map.addLayer(layer);


        

        //map.on("load", mapLoaded);

        function mapLoaded() {

          // Add raster layer
          if ( canvasSupport ) {
            
            layer = new TileCubeLayer('tiles/{level}/{col}/{row}.json', {
              tileType: 'canvas',
              hidpi: true, 
              temporal: false,
              style: function (val) {
                return {
                  radius: val
                }; 
              }
            });
            map.addLayer(layer);
            
          } else {
            dom.byId("mapCanvas").innerHTML = "This browser doesn't support canvas. Visit <a target='_blank' href='http://www.caniuse.com/#search=canvas'>caniuse.com</a> for supported browsers";
          }
        }

        // does the browser support canvas? 
        function supports_canvas() {
          return !!document.createElement("canvas").getContext;
        }

      });
    </script>
  </head>
  
  <body class="">
     <div id="mapCanvas" style="height:100%;">
     </div>
     <script src="vendor/hidpi-canvas.min.js"></script>
  </body>

</html>
