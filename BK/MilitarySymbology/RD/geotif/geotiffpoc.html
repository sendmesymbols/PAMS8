<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no">

  <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
  <title>Geotif Working Version</title>

  
  <link rel="stylesheet" href="http://devbox:9632/3.15/esri/css/esri.css">


  <style>
    html,
    body,
    html,
    body,
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
  <script src="tiff.min.js"></script>
    <script src="GeotiffParser.js"></script>
    
  <script src="http://devbox:9632/3.15/init.js"></script>

  <script>

    var map, mi, layer;

    require([
      "esri/map", "esri/geometry/Point",
      "esri/symbols/SimpleMarkerSymbol", "esri/graphic",
      "esri/layers/GraphicsLayer",
      "dojo/_base/array", "dojo/dom-style",
      "esri/symbols/SimpleFillSymbol",
      "esri/layers/MapImageLayer", "esri/layers/MapImage",
      "esri/layers/ArcGISTiledMapServiceLayer", "esri/layers/ArcGISDynamicMapServiceLayer",
      "esri/geometry/Extent",
      "dojo/domReady!"
    ], function (
      Map, Point,
      SimpleMarkerSymbol, Graphic,GraphicsLayer,
      arrayUtils, domStyle, SimpleFillSymbol, MapImageLayer, MapImage, ArcGISTiledMapServiceLayer, ArcGISDynamicMapServiceLayer, Extent
    ) {

        map = new Map("map");

        var tiled = new ArcGISDynamicMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/SampleWorldCities/MapServer");

        map.addLayer(tiled);


        map.on("load", mapLoaded);

        map.on("click", function (e) {








        });


        function readSingleFile(e) {
          var file = e.target.files[0];
          if (!file) {
            return;
          }
          var reader = new FileReader();
          reader.onload = function (e) {
            var contents = e.target.result;
            displayContents(contents);
          };
          reader.readAsArrayBuffer(file);
        }

        function displayContents(contents) {

                  var parser = new GeotiffParser();

                // parseHeader to read TIff / Geotiff parameters
                parser.parseHeader(contents);

                parser.consoleTiffProperty();

                // If a GeoTiff retrieve the BBOX
                console.log("isGeotiff=" +  parser.isGeotiff());
                if (parser.isGeotiff()) {
                  
                    console.log("CRS Code:" + parser.getCRSCode());
                    console.log("parser.GetBox()");
                    console.log(parser.GetBBox().coord);

                    var ul=  parser.ImageToPCS(0,0);
                    var ur=  parser.ImageToPCS(parser.imageWidth,0);
                    var ll=  parser.ImageToPCS(0,parser.imageLength);
                    var lr=  parser.ImageToPCS(parser.imageWidth,parser.imageLength);
                    if (ul[0]==1) console.log("UL=" +  ul[1],ul[2]); else console.log("UL= failure" );
                    if (ur[0]==1) console.log("UR=" +  ur[1],ur[2]); else console.log("UR= failure" );
                    if (ll[0]==1) console.log("LL=" +  ll[1],ll[2]); else console.log("LL= failure" );
                    if (lr[0]==1) console.log("LR=" +  lr[1],lr[2]); else console.log("LR= failure" );


                    var extent = new Extent(ll[1],ll[2],ur[1],ur[2] , map.spatialReference);
                      console.log("Extents");
                    console.log(parser.GetBBox().coord);

                     mi = new MapImage({
                        'href': 'latest.gif',
                        'extent': extent
                    });

                    
                    /*
                    mi = new MapImage({
                        'href': 'tux.png',
                        'extent': extent
                    });
                    */

                    layer.addImage(mi);
                    map.addLayer(layer);

                    var tiff = new Tiff({buffer: contents});
                    var dataURL = tiff.toDataURL();
                    mi._node.setAttribute("src", dataURL);

                    displayExtent(extent);
                   
                    //layer.setOpacity(0.5);
                }

          layer.addImage(mi);

        }


        function displayExtent(coords) {
          
          var graphicsLayer = new GraphicsLayer();
          map.addLayer(graphicsLayer);

          var ext = new Extent(coords);

          var graphic = new Graphic(ext, new SimpleFillSymbol());
          graphicsLayer.add(graphic);



        }



        document.getElementById('file-input')
          .addEventListener('change', readSingleFile, false);
        function mapLoaded() {
          layer = new MapImageLayer({
            'id': 'radar'
          });

          map.addLayer(layer);
        }
      });
  </script>
</head>

<body class="claro">
  <input type="file" id="file-input" />
  <h3>Contents of the file:</h3>
  <div id="map"></div>
</body>

</html>
