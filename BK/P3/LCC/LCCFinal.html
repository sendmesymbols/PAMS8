            "dijit/WidgetSet",
            "dijit/form/ToggleButton",
            "dijit/form/DropDownButton",

        ], function (
            Map, Draw, Graphic,
            SimpleMarkerSymbol, SimpleLineSymbol, SimpleFillSymbol, Circle, Font,
            Point, Polyline, Polygon,
            TextSymbol, parser, registry, event, dom, domStyle, Menu, GraphicsLayer, ArcGISTiledMapServiceLayer,
            PictureMarkerSymbol, Color, on, Menu, MenuItem, MenuSeparator, parser, matrix, Array,
            geometryJsonUtils, ArcGISDynamicMapServiceLayer,
            Extent

        ) {





                parser.parse();



                dojo.byId("GCSBtn").onclick = showGCS;
                dojo.byId("LCC1Btn").onclick = showLCC1;
                dojo.byId("LCC2Btn").onclick = showLCC2;

                map = createMap(map, call);


                //map.setLevel(0);
                var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer");
                map.addLayer(tiled);                

                /*           
                scrapeMap(map);

                map.addLayer(grid1);

                map.addLayer(grid2);
                */


                function showLCC1(e) {
                    scrapeMap(map);
                    map = createMap(map);
                    loadLCC1(map);
                    
                    
                }

                function showLCC2(e) {
                    scrapeMap(map);
                    map = createMap(map, call);
                    loadLCC2(map);
                    
                }


                function showGCS(e) {
                    scrapeMap(map);
                    map = createMap(map);
                    loadLGCS(map);
                    
                }

                function createMap(map, callback) {
                    if(map === undefined || map === null) {
                    var localMap = new Map("map", {
                        showAttribution: false
                    });
                    localMap.on("mouse-move", function (evt) {
                        var el = document.getElementById('latLonSpan');
                        el.innerHTML = '<b>[ </b>' + evt.mapPoint.x + ' <b>]  [ </b>' + evt.mapPoint.y + '<b> ]</b>';
                    });


                    localMap.on("zoom-end", function (evt) {
                        console.log('Activity')
                        shiftLayers(evt);
                    });


                    localMap.on("extent-change", function (evt) {
                        console.log('Extent Change')
                        shiftLayers(evt);
                    });

                    if(callback !== undefined) { callback(map); }
                    return localMap;
                    } else {
                    if(callback !== undefined) { callback(map); }
                    return map;
                    }
                    
                    

                }

                function scrapeMap(map) {
                    map.destroy();
                    map = null;
                    }


                function loadLCC1(map) {
                    var grid1 = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/grid1/MapServer");
                    grid1.id = "LCCG1";
                    map.addLayer(grid1);
                    console.log('LCC 1 Loaded')
                    console.log(map.extent)
                    console.log(map.spatialReference)

                    
                }


                function loadLCC2(map) {
                    var grid2 = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/grid2/MapServer");
                    grid2.id = "LCCG2";
                    map.addLayer(grid2);

                }


                function loadLGCS(map) {
                    var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer");
                    tiled.id = "GCS";
                    map.addLayer(tiled);

                }


                function shiftLayers(evt) {
                    //showLCC1(map);
                    
                    /*
                    console.log('Load LCC 1 called')
                    loadLCC1(map);
                    */

                    /*
                    console.info(evt.level);
                    if (evt.level >= 0 && evt.level <= 3) {
                      console.log('Load GCS');
                      scrapeMap(map);
                      loadLGCS(map);          
                    } else if (evt.level >= 4 && evt.level <= 5) {
                        console.log('Load Load LLC 1');
                      scrapeMap(map)
                      loadLCC1(map);
                    } else if (evt.level <= 6) {
                        console.log('Load Load LLC 2');
                      scrapeMap(map)
                      loadLCC2(map);
                    }
                    */
                   



                }


                function call(map) {
                    /*
                    console.info(map.spatialReference)

                    */
                    
                }
