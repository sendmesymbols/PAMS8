<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Ctrl</title>
    <style>
        html,
        body,
        #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }

        .planOptions {
            height: 32px;
            margin-bottom: 3px;
            font-size: larger;
            width: 70px;
        }
    </style>
    <link rel="stylesheet" href="http://20.60.201.241:9632/4.10/esri/css/main.css">
    <script src="http://20.60.201.241:9632/4.10/init.js"></script>

    <script src="jquery-3.3.1.min.js"></script>
    <script src="http://20.60.201.241:9632/MilitarySymbology/ThirdParty/milsymbol.js"></script>

    <script>
        var map, sceneView;
        var speedMultiplier = 2;
        var alt = 4000;

        require(["esri/Map",
            "esri/views/MapView",
            "esri/views/SceneView",
            "esri/Basemap",
            "esri/layers/Layer",
            "esri/layers/TileLayer",
            "esri/layers/MapImageLayer",
            "esri/layers/ElevationLayer",
            "esri/layers/VectorTileLayer",
            "esri/layers/GraphicsLayer",
            "esri/layers/FeatureLayer",
            "esri/Graphic",
            "esri/geometry/Extent",
            "esri/geometry/SpatialReference",
            "esri/symbols/TextSymbol",
            "esri/symbols/SimpleFillSymbol",
            "esri/geometry/Polygon",
            "esri/widgets/Fullscreen",
            "esri/Camera",
            "dojo/domReady!"
        ], function (Map, MapView, SceneView, Basemap, Layer, TileLayer, MapImageLayer, ElevationLayer,
            VectorTileLayer, GraphicsLayer, FeatureLayer, Graphic, Extent, SpatialReference,
            TextSymbol, SimpleFillSymbol, Polygon, Fullscreen, Camera
        ) {
                map = new Map();
                sceneView = new SceneView({
                    container: "viewDiv",     // Reference to the scene div created in step 5
                    map: map/*,                 // Reference to the map object created before the scene
                    scale: 50000,          // Sets the initial scale to 1:50,000,000
                    center: [73, 33]  // Sets the center point of view with lon/lat*/
                });


                fullscreen = new Fullscreen({
                    view: sceneView
                });
                sceneView.ui.add(fullscreen, "top-right");




                initMapLayers();


                sceneView.on("click", function (evt) {
                    const area = Polygon.fromExtent(sceneView.extent);
                    const graphic = new Graphic({
                        geometry: area,
                        symbol: { type: "simple-fill" }
                    });
                    //sceneView.graphics.add(graphic);

                });


                //listener for keyboard commands
                window.onkeypress = function (evt) {
                    //check which key was pressed
                    switch (evt.keyCode) {
                        case 97: rotateLeft(); break;
                        case 100: rotateRight(); break;
                        case 119: tiltUp(); break;
                        case 115: tiltDown(); break;
                        case 113: moveHigher(); break;
                        case 101: moveLower(); break;
                    }
                }

                //rotate the camera left
                function rotateLeft() {
                    var newHeading = sceneView.camera.heading - (1 * speedMultiplier);
                    sceneView.animateTo({
                        heading: newHeading
                    });

                }

                //rotate the camera right
                function rotateRight() {
                    var newHeading = sceneView.camera.heading + (1 * speedMultiplier);
                    sceneView.animateTo({
                        heading: newHeading
                    });
                }

                //tilt the camera up
                function tiltUp() {
                    var newTilt = sceneView.camera.tilt - (1 * speedMultiplier);
                    sceneView.animateTo({
                        tilt: newTilt
                    });
                }

                //tilt the camera down
                function tiltDown() {
                    var newTilt = sceneView.camera.tilt + (1 * speedMultiplier);
                    sceneView.animateTo({
                        tilt: newTilt
                    });
                }

                //increase the height of the camera
                function moveHigher() {
                    var point = sceneView.camera.position;
                    point.z += (100 * speedMultiplier);
                    sceneView.animateTo({
                        position: point
                    });
                }

                //decrease the height of the camera
                function moveLower() {
                    var point = sceneView.camera.position;
                    point.z -= (100 * speedMultiplier);
                    
                    sceneView.goTo({
                        position: point
                    });
                }






                function initMapLayers() {
                    // add layer as tiled layer --------------------------------
                    var tileLayer = new TileLayer({
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/OSM_Map_GEOGCS/MapServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/OSM_Map_WebMercator/MapServer"
                        url: "http://20.60.201.20:6080/arcgis/rest/services/GlobeBlueMarble/MapServer"

                    });
                    map.layers.add(tileLayer);


                    var topoLyr = new TileLayer({
                        url: "http://20.60.201.233:6080/arcgis/rest/services/ExTopoCanvas/MapServer"

                    });
                    map.layers.add(topoLyr);



                    // add layer as dynamic layer ------------------------------
                    var dynamicLayer = new MapImageLayer({
                        //url: "http://20.60.50.22:6080/arcgis/rest/services/OSM/MapServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/SampleWorldCities/MapServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/Dem7FCanvas/MapServer"
                        url: 'http://20.60.201.233:6080/arcgis/rest/services/ExTopoCanvas/MapServer'
                    });
                    //map.layers.add(dynamicLayer);



                    // add layer as basemap ------------------------------------
                    /*var baseMap = new Basemap({
                     baseLayers: [tileLayer],
                     title: 'OSM Tile',
                     id: 'osm_tile'
                     });*/
                    //map.basemap = baseMap;



                    // add layer as elevation / ground layer -------------------

                    //2nd Elevation Layer
                    var elevLayer2 = new ElevationLayer({
                        url: 'http://20.60.201.233:6080/arcgis/rest/services/ex73area1/ImageServer'

                    });
                    map.ground.layers.add(elevLayer2);


                    var elevLayer = new ElevationLayer({
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/Dem7F/ImageServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/Ex73/ImageServer" ///New Elev
                        url: 'http://20.60.201.20:6080/arcgis/rest/services/ex74area2/ImageServer'

                    });
                    map.ground.layers.add(elevLayer);

                    elevLayer.when(function (layer) {
                        sceneView.when(function () {
                            //sceneView.goTo(extent);
                            sceneView.goTo(layer.fullExtent);

                            //Draw Extent
                            const area = Polygon.fromExtent(layer.fullExtent);
                            const graphic = new Graphic({
                                geometry: area,
                                symbol: { type: "simple-fill" }
                            });
                            //sceneView.graphics.add(graphic);

                            console.log(elevLayer2.fullExtent.union(elevLayer.fullExtent));

                            //End of Draw Extent
                        });
                    }, function (e) {
                        console.log(e);
                    });

                }
            });

    </script>
</head>

<body>
    <div id="viewDiv"></div>
</body>

</html>
