    <title>3D map</title>
    <style>
        html,
        body,
        #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }

        .planOptions {
            height: 32px;
            margin-bottom: 4px;
            font-size: larger;
        }

    <link rel="stylesheet" href="http://20.60.201.241:9632/4.10/esri/css/main.css">

    <script>
        var map, d1, d2, sceneView;
        var alt = 700;

        require(["esri/Map",
            "esri/views/MapView",
            "esri/views/SceneView",
            "esri/Basemap",
            "esri/layers/Layer",
            "esri/layers/TileLayer",
            "esri/layers/MapImageLayer",
            "esri/layers/ElevationLayer",
            "esri/layers/VectorTileLayer",
            "esri/layers/GraphicsLayer",
            "esri/layers/FeatureLayer",
            "esri/Graphic",
            "esri/geometry/Extent",
            "esri/geometry/SpatialReference",
            "esri/symbols/TextSymbol",
            "esri/symbols/SimpleFillSymbol",
            "esri/geometry/Polygon",
            "esri/widgets/Fullscreen",
            "esri/widgets/Expand",
            "dojo/text!" + location.origin + "/" + "P3/3D/data1.json",
            "dojo/text!" + location.origin + "/" + "P3/3D/data2.json",
            "dojo/domReady!"
        ], function (Map, MapView, SceneView, Basemap, Layer, TileLayer, MapImageLayer, ElevationLayer,
            VectorTileLayer, GraphicsLayer, FeatureLayer, Graphic, Extent, SpatialReference,
            TextSymbol, SimpleFillSymbol, Polygon, Fullscreen, Expand,
            data1, data2
        ) {
                map = new Map();
                sceneView = new SceneView({
                    container: "viewDiv",     // Reference to the scene div created in step 5
                    map: map/*,                 // Reference to the map object created before the scene
                    scale: 50000,          // Sets the initial scale to 1:50,000,000
                    center: [73, 33]  // Sets the center point of view with lon/lat*/
                });


                fullscreen = new Fullscreen({
                    view: sceneView
                });
                sceneView.ui.add(fullscreen, "top-right");

                planListExpanded = new Expand({
                    expandIconClass: "esri-icon-layer-list",
                    expandTooltip: "Click to see aval plans",
                    view: sceneView,
                    content: getContent()
                });
                sceneView.ui.add(planListExpanded, "top-right");



                initMapLayers();




                var graphicsLayer = new GraphicsLayer({
                    id: 'graphicsLayer',
                    elevationInfo: {
                        mode: "relative-to-ground",
                        featureExpressionInfo: {
                            expression: "Geometry($feature).z * 10 + $feature.HEIGHT100"
                        },
                        unit: "meters"
                    }
                });
                map.add(graphicsLayer);



                d1 = data1;
                d2 = data2;






                sceneView.on("click", function (evt) {
                    const area = Polygon.fromExtent(sceneView.extent);
                    const graphic = new Graphic({
                        geometry: area,
                        symbol: { type: "simple-fill" }
                    });
                    //sceneView.graphics.add(graphic);

                });


                function loadFromJSON(data) {

                    graphicsLayer.removeAll();
                    data = JSON.parse(data);
                    for (var i = 0; i < data.length; i++) {
                        if (data[i].type === 'text') {
                            createTextSymbol(data[i].text, data[i].geometry, alt, graphicsLayer);

                        } else if (data[i].type === 'FPoint') {
                            createFpoint(data[i].SIDC, { 'uniqueDesignation': data[i].uniqueDesig }, data[i].geometry, alt, graphicsLayer);
                        } else if (data[i].type === 'polyline' || data[i].type === 'polygon') {
                            createMultiPt(data[i].geometry, data[i].SIDC, graphicsLayer, data[i].color);
                        } else if (data[i].type === 'TactPt') {
                            //----------:::::::::::::::TO DO ::::::::::::::::::::::------------------
                            console.log('Pt');

                        }
                    }

                }


                function createMultiPt(geometry, sidc, layer, color) {
                    var symbol;
                    if (geometry.type === 'polyline') {


                        symbol = {
                            type: "simple-line",
                            color: color,
                            width: 2.5
                        }





                    } else if (geometry.type === 'polygon') {




                        symbol = {
                            type: "simple-fill",  // autocasts as new SimpleFillSymbol()
                            color: [0, 0, 0, 0],
                            style: "none",
                            outline: {  // autocasts as new SimpleLineSymbol()
                                color: color,
                                width: 2.5
                            }
                        };



                    } //End of 

                    addGraphicTo(geometry, symbol, layer);


                } //End of Function else if(geometry.type === 'polygon')







                function createTextSymbol(text, pt, altitude, layer) {
                    var textSymbol = {
                        type: "text",  // autocasts as new TextSymbol()
                        color: "white",
                        haloColor: "black",
                        haloSize: "1px",
                        text: text,
                        xoffset: 3,
                        yoffset: 3,
                        font: {  // autocast as new Font()
                            size: 12,
                            family: "sans-serif",
                            weight: "bold"
                        }
                    };


                    pt.z = altitude;
                    var textSymGraphic = new Graphic({
                        geometry: pt,
                        symbol: textSymbol
                    });
                    layer.add(textSymGraphic);

                }

                function createFpoint(sidc, amplifiers, pt, altitude, layer) {

                    //amplifiers.size = 100;
                    //var milSymbol = new MS.symbol(sidc, amplifiers);
                    var milSymbol = new MS.symbol(sidc);
                    var pictureMarkerSymbol = {
                        type: "picture-marker",
                        url: milSymbol.getMarker().asImage(),
                        width: 30,
                        height: 30
                    };


                    pt.z = altitude;
                    var pointGraphic = new Graphic({
                        geometry: pt,
                        symbol: pictureMarkerSymbol
                    });
                    layer.add(pointGraphic);

                }

                function addGraphicTo(geom, sym, lyr) {

                    var graphic = new Graphic({
                        'geometry': geom,
                        'symbol': sym
                    });

                    lyr.add(graphic);

                }

                function loadPlan(val) {

                    if (val === '1') {

                        loadFromJSON(data1);

                    } else if (val === '2') {
                        loadFromJSON(data2);

                    }

                }




                function getContent() {
                    var mainDiv = document.createElement('div');

                    var b1 = document.createElement('button');
                    b1.setAttribute('id', 'p1Btn');
                    b1.setAttribute('class', 'planOptions');
                    b1.innerHTML = '1';
                    mainDiv.appendChild(b1);




                    var b2 = document.createElement('button');
                    b2.setAttribute('id', 'p2Btn');
                    b2.setAttribute('class', 'planOptions');



                    b2.innerHTML = '2';
                    mainDiv.appendChild(b2);

                    b1.addEventListener('click', function (evt) { loadPlan('1') });
                    b2.addEventListener('click', function (evt) { loadPlan('2') });


                    return mainDiv;
                }


                function initMapLayers() {
                    // add layer as tiled layer --------------------------------
                    var tileLayer = new TileLayer({
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/OSM_Map_GEOGCS/MapServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/OSM_Map_WebMercator/MapServer"
                        url: "http://20.60.201.20:6080/arcgis/rest/services/GlobeBlueMarble/MapServer"

                    });
                    map.layers.add(tileLayer);


                    var topoLyr = new TileLayer({
                        url: "http://20.60.201.233:6080/arcgis/rest/services/ExTopoCanvas/MapServer"

                    });
                    map.layers.add(topoLyr);



                    // add layer as dynamic layer ------------------------------
                    var dynamicLayer = new MapImageLayer({
                        //url: "http://20.60.50.22:6080/arcgis/rest/services/OSM/MapServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/SampleWorldCities/MapServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/Dem7FCanvas/MapServer"
                        url: 'http://20.60.201.233:6080/arcgis/rest/services/ExTopoCanvas/MapServer'
                    });
                    //map.layers.add(dynamicLayer);



                    // add layer as basemap ------------------------------------
                    /*var baseMap = new Basemap({
                     baseLayers: [tileLayer],
                     title: 'OSM Tile',
                     id: 'osm_tile'
                     });*/
                    //map.basemap = baseMap;



                    // add layer as elevation / ground layer -------------------

                    //2nd Elevation Layer
                    var elevLayer2 = new ElevationLayer({
                        url: 'http://20.60.201.233:6080/arcgis/rest/services/ex73area1/ImageServer'

                    });
                    map.ground.layers.add(elevLayer2);


                    var elevLayer = new ElevationLayer({
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/Dem7F/ImageServer"
                        //url: "http://20.60.201.233:6080/arcgis/rest/services/Ex73/ImageServer" ///New Elev
                        url: 'http://20.60.201.20:6080/arcgis/rest/services/ex74area2/ImageServer'

                    });
                    map.ground.layers.add(elevLayer);

                    elevLayer.when(function (layer) {
                        sceneView.when(function () {
                            //sceneView.goTo(extent);
                            sceneView.goTo(layer.fullExtent);

                            //Draw Extent
                            const area = Polygon.fromExtent(layer.fullExtent);
                            const graphic = new Graphic({
                                geometry: area,
                                symbol: { type: "simple-fill" }
                            });
                            //sceneView.graphics.add(graphic);

                            console.log(elevLayer2.fullExtent.union(elevLayer.fullExtent));

                            //End of Draw Extent
                        });
                    }, function (e) {
                        console.log(e);
                    });











                }
            });

    </script>
