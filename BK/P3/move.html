  function HaversineInM(lat1, long1, lat2, long2) {
    return (1000.0 * HaversineInKM(lat1, long1, lat2, long2));
}

function HaversineInKM(lat1, long1, lat2, long2) {

  var _eQuatorialEarthRadius = 6378.1370;
  var _d2r = (Math.PI / 180.0);

    var dlong = (long2 - long1) * _d2r;
    var dlat = (lat2 - lat1) * _d2r;
    var a = Math.pow(Math.sin(dlat / 2.0), 2.0) + Math.cos(lat1 * _d2r) * Math.cos(lat2 * _d2r) * Math.pow(Math.sin(dlong / 2.0), 2.0);
    var c = 2.0 * Math.atan2(Math.sqrt(a), Math.sqrt(1.0 - a));
    var d = _eQuatorialEarthRadius * c;

    return d;
}

     function _movePoint (point, distance, angle) {
    var radians = angle * (Math.PI / 180); // Convert angle to radians
    var newX = point.x + distance * Math.cos(radians); // calc new X
    var newY = point.y + distance * Math.sin(radians); // calc new Y
    var deltaX = newX - point.x;
    var deltaY = newY - point.y;
    console.log(deltaX, deltaY);
    return point.offset(deltaX, deltaY);
  }

      for (var pointIndex = 0; pointIndex < ring.length; pointIndex++) {
        var ringPoint = geometry.getPoint(ringIndex, pointIndex);
        geometry.setPoint(ringIndex, pointIndex, _movePoint(ringPoint, distance, angle));
      }
    }
    console.table(geometry.rings[0]);

    function createSECTION(dx, dy, dr, sp)
    {
      var pts = [];
      var step = 2*Math.PI / 180;
      dx1 = dx-(dr/4)-dr;
      dx2 = dx+(dr/4)+dr;
      
      for(var dtheta = 0*Math.PI/180;  dtheta < 360*Math.PI/180;  dtheta+=step)  { 
        var x = dx1 + dr*Math.cos(dtheta);
        var y = dy - dr*Math.sin(dtheta);
        pts.push(new Point(x,y,sp));
      }
      
      for(var dtheta = 0*Math.PI/180;  dtheta < 360*Math.PI/180;  dtheta+=step)  { 
        var x = dx2 + dr*Math.cos(dtheta);
        var y = dy - dr*Math.sin(dtheta);
        pts.push(new Point(x,y,sp));
      }
      return pts;
    }

        pts.push(new Point(x,y,sp));
      }
      
      
      pts.push(new Point(dx-(dr/3), dy-dr, sp));
      pts.push(new Point(dx, dy-dr, sp));
          
      
      pts.push(new Point(dx-(dr/3), dy-dr, sp));
      pts.push(new Point(dx-(dr/3), dy+dr, sp));
      
      return pts;
    }
    
    function createS(dx, dy, dr, sp)
    {
      var pts = [];
      
      var step = 2*Math.PI / 180;
      var ddr = dr/2;  

      
      pts.push(new Point(dx+(dr*0.3), dy+dr, sp));
      pts.push(new Point(dx, dy+dr, sp));
      //var dtheta = 90*Math.PI/180;  dtheta < 270*Math.PI/180;  dtheta+=step
      for(var dtheta = 90*Math.PI/180;  dtheta < 270*Math.PI/180;  dtheta+=step)  { 
        var x = dx + ddr*Math.cos(dtheta);
        var y = (dy+ddr) + ddr*Math.sin(dtheta);    //note 2.
        pts.push(new Point(x,y,sp));
      } 
      

      
      for(var dtheta = 90*Math.PI/180;  dtheta > 0*Math.PI/180;  dtheta-=step)  { 
        var x = dx + ddr*Math.cos(dtheta);
        var y = (dy-ddr) + ddr*Math.sin(dtheta);    //note 2.
        pts.push(new Point(x,y,sp));
      }
      

      
      for(var dtheta = 360*Math.PI/180;  dtheta > 270*Math.PI/180;  dtheta-=step)  { 
        var x = dx + ddr*Math.cos(dtheta);
        var y = (dy-ddr) + ddr*Math.sin(dtheta);    //note 2.
        pts.push(new Point(x,y,sp));
      }
      
      //line(dx, dy-dr, dx-(dr*0.3), dy-dr, ctx);
      pts.push(new Point(dx, dy-dr, sp));
      pts.push(new Point(dx-(dr*0.3), dy-dr, sp));
      
      
      return pts;
    }
      
    function createK(dx, dy, dr, sp)
    {
      var pts = [];
      //line(dx, dy+dr, dx, dy-dr, ctr);
      pts.push(new Point(dx, dy+dr, sp));
      pts.push(new Point(dx, dy-dr, sp));
      
      
      //line(dx, dy, dx+(dr*0.8), dy+dr, ctx);
      pts.push(new Point(dx, dy, sp));
      pts.push(new Point(dx+(dr*0.8), dy-dr, sp));
      
      //line(dx, dy, dx+(dr*0.8), dy-dr, ctx);
      pts.push(new Point(dx, dy, sp));
      pts.push(new Point(dx+(dr*0.8), dy+dr, sp));
      return pts;
      
    }
    
    function createB(dx, dy, dr, sp)
    {
      var pts = [];
      pts = createD(dx,dy+(dr/2),dr/2,sp);
      pts = pts.concat(createD(dx,dy-(dr/2),dr/2,sp));
      return pts;
    }
    
    function createY(dx, dy, dr, sp)
    {
      var pts = [];
      pts.push(new Point(dx, dy, sp));
      pts.push(new Point(dx, dy-dr, sp));
      
      pts.push(new Point(dx, dy, sp));
      pts.push(new Point(dx-(dr*0.6), dy+dr, sp));
      
      pts.push(new Point(dx, dy, sp));
      pts.push(new Point(dx+(dr*0.6), dy+dr, sp));
      return pts;
    }
    
    function createE(dx, dy, dr, sp)
    {
      var pts = [];
      pts.push(new Point(dx, dy-dr, sp));
      pts.push(new Point(dx, dy+dr, sp));
      
      pts.push(new Point(dx, dy+dr, sp));
      pts.push(new Point(dx+dr, dy+dr, sp));

      pts.push(new Point(dx, dy+dr, sp));
      
      pts.push(new Point(dx, dy, sp));
      pts.push(new Point(dx+(dr*0.8), dy, sp));

      //line(, , ctx);
      pts.push(new Point(dx, dy, sp));
      
      pts.push(new Point(dx, dy-dr, sp));
      pts.push(new Point(dx+dr, dy-dr, sp));
      
      return pts;
    }
    
    function CATK1(dx, dy, dr, sp)
    {
      var pts = [];
      pts = createC(dx-(dr*1.67), dy, dr, sp);    //1st 
      pts = pts.concat(createA(dx-(dr*0.5), dy, dr, sp));
      pts = pts.concat(createT(dx+(dr*0.83), dy, dr, sp));
      pts = pts.concat(createK(dx+(dr*1.83), dy, dr, sp));
      return pts;
    }

    function ENY(dx, dy, dr, sp)
    {
      var pts = [];
      pts = createE(dx-(dr*1.667), dy, dr, sp);
      pts = pts.concat(createN(dx+(dr*0.083), dy, dr, sp));
      pts = pts.concat(createY(dx+(dr*1.38), dy, dr, sp));
      return pts;
    } 

    function WP(dx, dy, dr, sp) {
      var pts = [];
      pts = createW(dx-(dr*0.5), dy, dr, sp);
      pts = pts.concat(createP(dx+(dr*0.7), dy, dr, sp));
      return pts;
    }
