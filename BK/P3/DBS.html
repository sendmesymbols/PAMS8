          function zoomGeom(map, graphicsLayer, textGraphicsLayer, event) { 
            if(graphicsLayer.graphics.length > 0) { 
            var extent = new Extent();
            extent.setSpatialReference(map.spatialReference);
            extent = addIntoExtent(extent, graphicsLayer.graphics[0].geometry, true);
            for (var i = graphicsLayer.graphics.length - 1; i >= 1; i--) {
              extent = addIntoExtent(extent, graphicsLayer.graphics[i].geometry);
            }

           

           map.setExtent(extent.expand(1.5));
           



            var SnappingManager = map.enableSnapping({
              snapKey: has("mac") ? keys.META : keys.CTRL
            });
            
         }
           



           }

           function addIntoExtent(extent, geometry, isFirst) {
            var resExtent = new Extent();

            if(isFirst) {
            if(geometry.type === 'point')  {
              var p = new Polyline();
              p.setSpatialReference(geometry.spatialReference);
              p.addPath([geometry, geometry]);
              resExtent = p.getExtent();
              }
            if(geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = geometry.getExtent();
            } else {
              if(geometry.type === 'point') resExtent = extent.union({'xmin' : geometry.x, 'ymin': geometry.y, 'xmax' : geometry.x, 'ymax': geometry.y});
            if(geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = extent.union(geometry.getExtent());
            }

            console.log('Called');
            return resExtent;
           }
