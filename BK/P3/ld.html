<!DOCTYPE html>

<script>
window.onload = function() {


var el = document.getElementById('canvas2');
var ctx = el.getContext('2d');
var decorationLength = -10;
var decorationSpacing = 30;
var distanceThreshold = 4;


ctx.lineWidth = 1;
ctx.lineJoin = ctx.lineCap = 'round';
ctx.strokeStyle = 'purple';

var isDrawing, lastPoint;
var runningLength = 0;
var lastDecorationPos = -decorationSpacing;

el.onmousedown = function (e) {
    isDrawing = true;
    runningLength = 0;
    lastDecorationPos = -decorationSpacing;
    lastPoint = null;
};

el.onmousemove = function (e) {
    if (!isDrawing) return;
    var currentPoint = {
        x: e.clientX,
        y: e.clientY
    };
    if (!lastPoint) {
        lastPoint = currentPoint;
        return;
    }
    if (simpleDistance(lastPoint, currentPoint) < distanceThreshold) return;
    runningLength += drawDecoratedSegment(lastPoint, currentPoint, decorationLength, runningLength);
    lastPoint = currentPoint;

};

el.onmouseup = function () {
    isDrawing = false;
};

function drawDecoratedSegment(A, B, l, runningLength) {
    // vector AB
    var ABx = B.x - A.x;
    var ABy = B.y - A.y;
    var ABLength = Math.sqrt(ABx * ABx + ABy * ABy);
    // normalized vector AB
    var NABx = ABx / ABLength;
    var NABy = ABy / ABLength;
    // Perpendicular + normalized vector.
    var PNAB = {  x: -NABy,  y: NABx    };
    // 
    var C = { x: 0, y: 0    };
    var D = { x: 0, y: 0    };
    //
    drawSegment(A, B);
    // end length of drawn segment
    var endLength = runningLength + ABLength;
    // while we can draw a decoration on this line
    while (lastDecorationPos + decorationSpacing < endLength) {
        // compute relative position of decoration.
        var decRelPos = (lastDecorationPos + decorationSpacing) - runningLength;
        // compute C, the start point of decoration
        C.x = A.x + decRelPos * NABx;
        C.y = A.y + decRelPos * NABy;
        // compute D, the end point of decoration      
        D.x = C.x + l * PNAB.x;
        D.y = C.y + l * PNAB.y;
        // draw
        drawSegment(C, D);
        // iterate
        lastDecorationPos += decorationSpacing;
    }
    return ABLength;
}

function drawSegment(A, B) {
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    ctx.stroke();
}

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


function clearRect2() {
    ctx.clearRect(0, 0, 600, 600);
}

function simpleDistance(A, B) {
    return Math.abs(A.x - B.x) + Math.abs(A.y - B.y);
}



drawLine();

function angle(p1, p2) {
    return Math.atan2(p2.y - p1.y, p2.x - p1.x);

}


function drawDecoratedSegment(A, B, l, runningLength, ctx) {
    // vector AB
    var ABx = B.x - A.x;
    var ABy = B.y - A.y;
    var ABLength = Math.sqrt(ABx * ABx + ABy * ABy);
    // normalized vector AB
    var NABx = ABx / ABLength;
    var NABy = ABy / ABLength;
    // Perpendicular + normalized vector.
    var PNAB = {  x: -NABy,  y: NABx    };
    // 
    var C = { x: 0, y: 0    };
    var D = { x: 0, y: 0    };
    //
    drawSegment(A, B, ctx);
    // end length of drawn segment
    var endLength = runningLength + ABLength;
    // while we can draw a decoration on this line
    while (lastDecorationPos + decorationSpacing < endLength) {
        // compute relative position of decoration.
        var decRelPos = (lastDecorationPos + decorationSpacing) - runningLength;
        // compute C, the start point of decoration
        C.x = A.x + decRelPos * NABx;
        C.y = A.y + decRelPos * NABy;
        // compute D, the end point of decoration      
        D.x = C.x + l * PNAB.x;
        D.y = C.y + l * PNAB.y;
        // draw
        drawSegment(C, D, ctx);
        // iterate
        lastDecorationPos += decorationSpacing;
    }
    return ABLength;
}

function drawSegment(A, B, ctx) {
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    ctx.stroke();
}
