        function addIntoExtent(extent, geometry, isFirst) {

          var resExtent = new Extent();
          if (extent !== null || extent !== undefined) {
            if (isFirst) {
              if (geometry.type === 'point') {
                var newExtent = new Extent();
                newExtent.setSpatialReference(extent.spatialReference);

                newExtent.xmin = geometry.x;
                newExtent.xmax = geometry.x;

                newExtent.ymin = geometry.y;
                newExtent.ymax = geometry.y;

                resExtent = newExtent;
              }
              if (geometry.type === 'polygon' || geometry.type === 'polyline') {
                var t = geometry.getExtent();
                if (t !== undefined) {
                  resExtent = t;
                }

              }

            } else {
              if (geometry.type === 'point')
                resExtent = extent.union({
                  'xmin': geometry.x,
                  'ymin': geometry.y,
                  'xmax': geometry.x,
                  'ymax': geometry.y
                });
              if (geometry.type === 'polygon' || geometry.type === 'polyline') {
                var s = geometry.getExtent();
                if (s !== undefined) {
                  resExtent = extent.union(s);
                }


              }

            }


            return resExtent;
          }
        }

        function zoomGeom(map, graphicsLayer, textGraphicsLayer, event) {
          if (graphicsLayer.graphics.length > 0) {
            var extent = new Extent();
            extent.setSpatialReference(map.spatialReference);
            extent = addIntoExtent(extent, graphicsLayer.graphics[0].geometry, true);
            for (var i = graphicsLayer.graphics.length - 1; i >= 1; i--) {
              extent = addIntoExtent(extent, graphicsLayer.graphics[i].geometry);
            }



            map.setExtent(extent.expand(1.5));




            var SnappingManager = map.enableSnapping({
              snapKey: has("mac") ? keys.META : keys.CTRL
            });

          }




        }

        function addIntoExtent(extent, geometry, isFirst) {
          var resExtent = new Extent();

          if (isFirst) {
            if (geometry.type === 'point') {
              var p = new Polyline();
              p.setSpatialReference(geometry.spatialReference);
              p.addPath([geometry, geometry]);
              resExtent = p.getExtent();
            }
            if (geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = geometry.getExtent();
          } else {
            if (geometry.type === 'point') resExtent = extent.union({ 'xmin': geometry.x, 'ymin': geometry.y, 'xmax': geometry.x, 'ymax': geometry.y });
            if (geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = extent.union(geometry.getExtent());
          }


          return resExtent;
        }

        //Animation Handler

        function flashFeature2(graphic, circle, count, num) {

          if (graphic === null) { return; }

          var graphicFlash, extent;

          var symbolFlashPoint = new SimpleMarkerSymbol(SimpleMarkerSymbol.STYLE_SQUARE, 10,
            new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID, new Color([255, 0, 0]), 1),
            new Color([255, 0, 0, 0.5]));
          var symbolFlashPolyline = new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID,
            new Color([255, 0, 0, 0.5]), 3);
          var symbolFlashPolygon = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
            new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID, new Color([255, 0, 0]), 2),
            new Color([255, 0, 0, 0.25]));

          switch (graphic.geometry.type) {
            case "point":
              extent = graphic.geometry;
              graphicFlash = new Graphic(graphic.geometry, symbolFlashPoint);
              break;
            case "multipoint":
              extent = graphic.geometry.getExtent();
              graphicFlash = new Graphic(graphic.geometry, symbolFlashPoint);
              break;
            case "polyline":
              extent = graphic.geometry.getExtent();
              graphicFlash = new Graphic(graphic.geometry, symbolFlashPolyline);
              break;
            case "polygon":
              extent = graphic.geometry.getExtent();
              graphicFlash = new Graphic(graphic.geometry, symbolFlashPolygon);
              break;
            case "extent":
              extent = graphic.geometry;
              graphicFlash = new Graphic(graphic.geometry, symbolFlashPolygon);
              break;
          }

          if (!map.extent.contains(extent)) { return; }


          map.graphics.add(graphicFlash);

          //var shape = graphicFlash.getDojoShape();
          var shape = graphic.getDojoShape();
          var animStroke = dojoxGfxFx.animateStroke({
            shape: shape,
            duration: 500,
            color: { end: new Color([0, 0, 0, 0]) }
          });
          var animFill = dojoxGfxFx.animateFill({
            shape: shape,
            duration: 500,
            color: { end: new Color([0, 0, 0, 0]) }
          });

          var animTrans = dojoxGfxFx.animateTransform({
            shape: shape,
            duration: 500,
            transform: [{"name": "rotategAt", start: [0,0,0], end:[360,0,0]}]
          });

          
          var pt;
          var geomIndex;
          if(num === 0 ) {            
            geomIndex = 0;
          } else {
            
            geomIndex = Math.floor(circleGeometry.rings[0].length / count);
          }

          pt = new Point(circleGeometry.rings[0][geomIndex + geomIndex]);
          //pt = map.toScreen(pt);
          pt = new Point(73.0483712834006, 33.60436322455114, map.spatialReference);
          var pt2 = map.toScreen(pt);
          
          var animTranslate = dojoxGfxFx.animateTransform({
            shape: shape,
            duration: 500,
            transform: [
            {
              "name": "translate", 
              start: [0,0],
              end:[pt2.x, pt2.y]
            },
            {"name": "original"}
            ]


          });

          GeoTools.displayPoint(map, graphic.geometry);
          GeoTools.displayPoint(map, circleGeometry.center);


          
          var anim = coreFx.combine([animStroke, animFill, animTranslate]).play();
          aspect.after(anim, "onEnd", function () {
            map.graphics.remove(graphicFlash);
          });
        }
