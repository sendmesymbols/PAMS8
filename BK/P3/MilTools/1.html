<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!--The viewport meta tag is used to improve the presentation and behavior of the samples  
       on iOS devices-->
  <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
  <title>Map with WMS</title>

  <link rel="stylesheet" href="http://arb-pc2:9632/3.15/dijit/themes/nihilo/nihilo.css">
  <link rel="stylesheet" href="http://arb-pc2:9632/3.15/esri/css/esri.css">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body, #map {  
            height: 100%;  
            width: 100%;  
            margin: 0;  
            padding: 0;  
        }  
        body {  
            background-color: #FFF;  
            overflow: hidden;  
            font-family: "Trebuchet MS";  
        }  
    </style>
  <script src="http://arb-pc2:9632/3.15/init.js"></script>

  <script>
    var map;

    require(["esri/map", "esri/layers/WMSLayer", "esri/config", "esri/layers/WMSLayerInfo",
      "esri/geometry/Extent", "esri/layers/FeatureLayer", "esri/layers/ArcGISTiledMapServiceLayer",
      "esri/layers/ArcGISDynamicMapServiceLayer", "esri/basemaps"],
      function (Map, WMSLayer, esriConfig, WMSLayerInfo, Extent, FeatureLayer,
        ArcGISTiledMapServiceLayer, ArcGISDynamicMapServiceLayer,
        basemaps) {

        map = new Map("map");
        var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer");
        map.addLayer(tiled);

      });



  </script>
</head>

<body>

<div>

  <div class="tabsContainer" data-dojo-attach-point="tabContainer"></div>

  <div data-dojo-attach-point="lineTabNode">
    <div class="tabPanel" data-dojo-attach-point="lineContainer">
      <div class="controls">
    
      <div class="controlGroup">
        <label>Type</label>
        <div class="controlItem">
          <select disabled="disabled" style="width: 225px" data-dojo-type="dijit/form/Select">
            <option selected="selected" value="Geodesic">Geodesic</option>
            <option value="GreatElliptic">Great Elliptic</option>
            <option value="Loxodrome">Loxodrome</option>
          </select>
        </div>
      </div>
    
      <div class="controlGroup">
          <label>From</label>
          <div class="controlItem">
            <select data-dojo-attach-point="lineTypeDD" style="width: 225px" data-dojo-type="dijit/form/Select">
              <option value="DistAndBearing">Distance and Bearing</option>
              <option selected="selected" value="Points">Points</option>
            </select>
        </div>
      </div>
    
      <div class="controlGroup">
          <label data-dojo-attach-point="lineStartPointLabel">Start Point</label>
          <div class="controlItem">
            <input class="jimu-input coordInput" data-dojo-attach-point="startPointCoordsLine" placeholder="Enter Coordinates" />
            <span class="frmtBtn" data-dojo-attach-point="coordinateFormatButtonLine"></span>
            <div class="addPointBtn" data-dojo-attach-point="addPointBtnLine"></div>
        </div>
      </div>
    
      <div class="controlGroup endPt">
        <label data-dojo-attach-point="lineEndPointLabel">End Point</label>
        <div class="controlItem">
          <input class="jimu-input coordInput" data-dojo-attach-point="endPointCoordsLine"></input>
        </div>
      </div>
    
      <div class="controlGroup">
        <label>Length</label>
        <div class="controlItem">
          <input
            data-dojo-type='dijit/form/NumberTextBox'
            required="true" value="1" data-dojo-props="
            constraints: {min: 1, max: 40030000},
            invalidMessage: 'Please enter a numeric value.',
            rangeMessage: 'Invalid Line Length'"
            data-dojo-attach-point="lengthInput"></input>
          <select style="width: 100px" class="controlSpace" data-dojo-type="dijit/form/Select" data-dojo-attach-point="lengthUnitDD" >
            <option value="feet">Feet</option>
            <option value="kilometers">Kilometers</option>
            <option value="miles">Miles</option>
            <option selected="selected" value="meters">Meters</option>
            <option value="nautical-miles">Nautical Mile</option>
            <option value="yards">Yards</option>
          </select>
        </div>
      </div>
    
      <div class="controlGroup">
        <label>Angle</label>
        <div class="controlItem">
          <input data-dojo-type="dijit/form/NumberTextBox"
            required="true"
            value="1"
            data-dojo-props="
              constraints: {min: 0, max: 6283},
              invalidMessage: 'Please enter a numeric value.',
              rangeMessage: 'Invalid Angle'"
            data-dojo-attach-point="angleInput">
          </input>
          <select style="width: 100px" class="controlSpace" data-dojo-type="dijit/form/Select" data-dojo-attach-point="angleUnitDD">
            <option value="degrees">Degrees</option>
            <option value="mils">Mils</option>
          </select>
        </div>
      </div>
    
      </div>
    </div>
    
  </div>

  <div data-dojo-attach-point="circleTabNode"></div>

  <div data-dojo-attach-point="ellipseTabNode"></div>

  <div data-dojo-attach-point="rangeTabNode"></div>

  <div class="buttonContainer">
    <div class='jimu-btn' data-dojo-attach-point='clearGraphicsButton'>Clear Graphics</div>
  </div>
</div>


<div id="map"></div>

</body>

</html>
