    <script>
      var map, graphicsLayer, toolbar, symbol, geomTask, editToolbar, isDrawing , ctxMenuForGraphics, ctxMenuForMap;
      var selected, currentLocation;

      require([
        "esri/map",
        "esri/toolbars/draw",
        "esri/graphic",
        "esri/symbols/SimpleMarkerSymbol",
        "esri/symbols/SimpleLineSymbol",
        "esri/symbols/SimpleFillSymbol",
        "esri/geometry/Circle",



        "esri/toolbars/edit",
        "esri/geometry/Point",
        "esri/geometry/Polyline",
        "esri/geometry/Polygon",
        "esri/symbols/TextSymbol",
        "dojo/parser",
        "dijit/registry",
        "dojo/_base/event",
        "dojo/dom",
        "dojo/dom-style",
        "dijit/Menu",
        "esri/layers/GraphicsLayer",
        "esri/layers/ArcGISTiledMapServiceLayer",


        "dijit/layout/BorderContainer",
        "dijit/layout/ContentPane",
        "dijit/form/Button",
         "dijit/WidgetSet",

        "dijit/form/ToggleButton",
        "dijit/form/DropDownButton",
        "dijit/CheckedMenuItem",


        "dojo/domReady!"
      ], function(
        Map, Draw, Graphic,
        SimpleMarkerSymbol, SimpleLineSymbol, SimpleFillSymbol, Circle,

        Edit, Point, Polyline, Polygon,
        TextSymbol,   parser, registry,  event, dom, domStyle, Menu, GraphicsLayer, ArcGISTiledMapServiceLayer
      ) {
        parser.parse();
        isDrawing = false;

        map = new Map("map", {
          logo: false,
          showAttribution : false
          //, basemap: "streets",
          //center: [-15.469, 36.428],  zoom: 3
        });

        //var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.71/arcgis/rest/services/MapdataV3/MapServer");
        var tiled = new ArcGISTiledMapServiceLayer("http://server.arcgisonline.com/arcgis/rest/services/ESRI_StreetMap_World_2D/MapServer");
        
        map.addLayer(tiled);

        map.on("load", createToolbar);

        // loop through all dijits, connect onClick event
        // listeners for buttons to activate drawing tools
        registry.forEach(function(d) {
          // d is a reference to a dijit
          // could be a layout container or a button
          if ( d.declaredClass === "dijit.form.Button" ) {
            d.on("click", activateTool);
          }


         




        });

        function activateTool(graphic) {
          var tool = this.label.toUpperCase().replace(/ /g, "_");
          toolbar.activate(Draw[tool]);
          map.hideZoomSlider();
          isDrawing = true;


        }


        function activateEdit(graphic) {
           var tool = 0;

           if (registry.byId("tool_move").checked) {
             tool = tool | Edit.MOVE;
           }
           if (registry.byId("tool_vertices").checked) {
             tool = tool | Edit.EDIT_VERTICES;
           }
           if (registry.byId("tool_scale").checked) {
             tool = tool | Edit.SCALE;
           }
           if (registry.byId("tool_rotate").checked) {
             tool = tool | Edit.ROTATE;
           }
           // enable text editing if a graphic uses a text symbol
           if ( graphic.symbol.declaredClass === "esri.symbol.TextSymbol" ) {
             tool = tool | Edit.EDIT_TEXT;
           }
           //specify toolbar options
           var options = {
             allowAddVertices: registry.byId("vtx_ca").checked,
             allowDeleteVertices: registry.byId("vtx_cd").checked,
             uniformScaling: registry.byId("uniform_scaling").checked
           };
           editToolbar.activate(tool, graphic, options);
         }

        function createToolbar(theMap) {

       
        dojo.byId("drawCircleBtn").onclick =  drawCircle;
        dojo.byId("drawIrrBtn").onclick =  drawIrr;
        dojo.byId("drawPaperJSBtn").onclick =  drawPaperJS;

        


          toolbar = new Draw(map);
          toolbar.on("draw-end", addToMap);


          editToolbar = new Edit(map);

          

          //Activate the toolbar when you click on a graphic

          

          //deactivate the toolbar when you click outside a graphic
          map.on("dbl-click", function(evt){

            editToolbar.deactivate();

          });

          graphicsLayer = new GraphicsLayer();
          map.addLayer(graphicsLayer);

          graphicsLayer.on("dbl-click", function(evt) {
            if(!isDrawing) {
            event.stop(evt);
            activateEdit(evt.graphic);
          }
          });

          


        
        

        }
        
        function drawCircle(e) {

          var s = map.on("click", function(e) {
          var radius = map.extent.getWidth() / 10;
          var circle = new Circle({
            center: e.mapPoint,
            geodesic: true,
            radius: radius
          });
          var symbol = new SimpleFillSymbol().setColor(null).outline.setColor("blue")
          var graphic = new Graphic(circle, symbol);
          graphicsLayer.add(graphic);

          s.remove();

          });
          
        } 

        
         function drawIrr(e) {

          
          var s = map.on("click", function(e) {

          var symbol = new SimpleFillSymbol().setColor(null).outline.setColor("blue"); 
          var line = new Polyline([[[-50, 0], [-120, -20], [-130, 0]],[[-50, -2], [-120, -22], [-130, -2]]]);  
          var graphic = new Graphic(line, symbol);  
          graphicsLayer.add(graphic);

          s.remove();
          
          

          }); 
          
        }

                  if(pArray[i+1] != undefined) {

                    line.addPath([
                    [pArray[i].x, pArray[i].y],
                    [pArray[i+1].x, pArray[i+1].y]
                  ]);

                    /*
                    line.addPath([
                    [pArray[i].x, pArray[i].y],
                    [pArray[i+1].x, pArray[i+1].y]
                  ]);
*/

                   
           // i++;
          }
          else
          {
             line.addPath([
                    [pArray[i].x, pArray[i].y],

            ctx.closePath();     //close the end to the start point
            ctx.stroke();        //actually draw the accumulated lines

          graphicsLayer.add(graphic);

          for (var i = 0; i < line.paths.length; i++) {
            
            if(line.paths[i+1] != undefined) {

          var graphic2 = new Graphic(combinedPolyLine, symbol);  
          graphicsLayer.add(graphic2);



          s.remove();

         
          
          

          }); 
          
        } 
        


        function addToMap(evt) {
          var symbol;
          toolbar.deactivate();

          map.showZoomSlider();
          switch (evt.geometry.type) {
            case "point":
            case "multipoint":
              symbol = new SimpleMarkerSymbol();
              break;
            case "polyline":
              symbol = new SimpleLineSymbol();
              //Compute Angle
              // angle in radians
              //var angleRadians = Math.atan2(p2.y - p1.y, p2.x - p1.x);
              var angleRadians = Math.atan2(evt.geometry.getPoint(0,1).y - evt.geometry.getPoint(0,0).y, evt.geometry.getPoint(0,1).x - evt.geometry.getPoint(0,0).x);

              console.log(angleRadians);

              

              // angle in degrees
              //var angleDeg = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;

              var angleDeg = Math.atan2(evt.geometry.getPoint(0,1).y -evt.geometry.getPoint(0,0).y, evt.geometry.getPoint(0,1).x - evt.geometry.getPoint(0,0).x) * 180 / Math.PI;
             
              console.info("Angle in Degrees " +angleDeg);
              console.info(evt.geometry.getPoint(0,0));
              console.info(evt.geometry.getPoint(0,1));

              var three60Angle = ((angleDeg % 360 ) + 360 ) % 360;
              console.info(three60Angle);
              //End of Compute Angle

              //Slope
              //(Y2-Y1) / (X2-X1)
              var slope  = (evt.geometry.getPoint(0,1).y -evt.geometry.getPoint(0,0).y) /
               ( evt.geometry.getPoint(0,1).x - evt.geometry.getPoint(0,0).x);
               console.info("Slope "+ slope);
              
              //End of Slope

              //Line at Angle
          
              var length = 30;
              var angle = 360;// In Degrees



              

              var np = new Point(evt.geometry.getPoint(0,0).x + length * Math.cos(toRad(angle)), 
                evt.geometry.getPoint(0,0).y + length * Math.sin(toRad(angle)), map.spatialRefernce);


              var newLineGeom = new Polyline(map.spatialRefernce);
              
          

              newLineGeom.addPath([[evt.geometry.getPoint(0,0).x,evt.geometry.getPoint(0,0).y], [np.x,np.y]]);
                

              /*

              newLineGeom.addPath([new Point(50,55), new Point(70,80), new Point(90,100)]);
              newLineGeom.addPath([[10,10], [20,20], [30,60],[60,70]]);

              newLineGeom.addPath([[120,130], [140,150]]);
              */



              var newLineSymbol = new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASH);
              var newLineGraphic = new Graphic(newLineGeom, symbol);
              graphicsLayer.add(newLineGraphic);
              
              



              //End of Line at Angle

            



              
              break;
            default:
              symbol = new SimpleFillSymbol();

              break;
          }
          var graphic = new Graphic(evt.geometry, symbol);
          graphicsLayer.add(graphic);
          isDrawing = false;
        }

            function toDegrres(rad) {
             return rad*(180/Math.PI);
             }
             
            function toRad(deg) {
             return deg * (Math.PI/180);
             }


    function lineAtAngle(p1, length, angle) {
      //ctx.moveTo(x1, y1);
      //ctx.lineTo(x1 + length * Math.cos(angle), y1 + length * Math.sin(angle));
      return new Point(p1.x + length * Math.cos(angle), p1.y + length * Math.sin(angle));
    }




      });
    </script>

  <body class="nihilo">

  <div id="mainWindow" data-dojo-type="dijit/layout/BorderContainer" data-dojo-props="design:'headline'">


    <div id="header2" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'top'" style="text-align:left;font-weight:bold;font-size:14px;color:#400D12;">

      <div id="tool_move" data-dojo-type="dijit/form/ToggleButton" data-dojo-props="checked:'true', iconClass:'dijitCheckBoxIcon'">Move</div>
      <div id="tool_vertices" data-dojo-type="dijit/form/ToggleButton" data-dojo-props="checked:'true', iconClass:'dijitCheckBoxIcon'">Edit Vertices</div>
      <div id="tool_scale" data-dojo-type="dijit/form/ToggleButton" data-dojo-props="checked:'true', iconClass:'dijitCheckBoxIcon'">Scale</div>
      <div id="tool_rotate" data-dojo-type="dijit/form/ToggleButton" data-dojo-props="checked:'true', iconClass:'dijitCheckBoxIcon'">Rotate</div>
      <button data-dojo-type="dijit/form/DropDownButton" id="options"  data-dojo-props="value:'options'">
        <span>Options</span>
        <div data-dojo-type="dijit/Menu" id="optionsMenu">
          <div id="vtx_ca" data-dojo-type="dijit/CheckedMenuItem" data-dojo-props="checked:'true'">Allow Add Vertices</div>
          <div id="vtx_cd" data-dojo-type="dijit/CheckedMenuItem" data-dojo-props="checked:'true'">Allow Delete Vertices</div>
          <div id="uniform_scaling" data-dojo-type="dijit/CheckedMenuItem" data-dojo-props="checked:'true'">Uniform Scaling when Resizing</div>
        </div>
      </button>
    </div>



    <div id="header" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'top'">

      <button data-dojo-type="dijit/form/Button">Polyline</button>
      <button data-dojo-type="dijit/form/Button">Polygon</button>
      <button data-dojo-type="dijit/form/Button">Freehand Polyline</button>
      <button data-dojo-type="dijit/form/Button">Freehand Polygon</button>

      <button data-dojo-type="dijit/form/Button">Arrow</button>
      <button data-dojo-type="dijit/form/Button">Triangle</button>
      <button data-dojo-type="dijit/form/Button">Circle</button>
      <button data-dojo-type="dijit/form/Button">Ellipse</button>

      
    </div>

      <div id="header3" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'top'">
     
      <button id="drawCircleBtn">Circle</button>
      <button id="drawIrrBtn">Draw Irregular</button> 
      <button id="drawPaperJSBtn">Draw PaperJS</button> 

    </div>

    <div id="map" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'center'"></div>
  </div>
   <canvas id="myCanvas"></canvas>
