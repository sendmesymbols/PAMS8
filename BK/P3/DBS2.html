          function zoomGeom(map, graphicsLayer, textGraphicsLayer, event) { 
            if(graphicsLayer.graphics.length > 0) { 
            var extent = new Extent();
            extent.setSpatialReference(map.spatialReference);
            extent = addIntoExtent(extent, graphicsLayer.graphics[0].geometry, true);
            for (var i = graphicsLayer.graphics.length - 1; i >= 1; i--) {
              extent = addIntoExtent(extent, graphicsLayer.graphics[i].geometry);
            }

           

           map.setExtent(extent.expand(1.5));
           



            var SnappingManager = map.enableSnapping({
              snapKey: has("mac") ? keys.META : keys.CTRL
            });
            
         }
           



           }

           function addIntoExtent(extent, geometry, isFirst) {
            var resExtent = new Extent();

            if(isFirst) {
            if(geometry.type === 'point')  {
              var p = new Polyline();
              p.setSpatialReference(geometry.spatialReference);
              p.addPath([geometry, geometry]);
              resExtent = p.getExtent();
              }
            if(geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = geometry.getExtent();
            } else {
              if(geometry.type === 'point') resExtent = extent.union({'xmin' : geometry.x, 'ymin': geometry.y, 'xmax' : geometry.x, 'ymax': geometry.y});
            if(geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = extent.union(geometry.getExtent());
            }

            console.log('Called');
            return resExtent;
           }

   function bearingFinal(start, end, options) {
    // Backwards compatible with v4.0

    var degrees2radians = Math.PI / 180;
    var radians2degrees = 180 / Math.PI;
    
    var lon1 = degrees2radians * start.x;
    var lon2 = degrees2radians * end.x;
    var lat1 = degrees2radians * start.y;
    var lat2 = degrees2radians * end.y;
    var a = Math.sin(lon2 - lon1) * Math.cos(lat2);
    var b = Math.cos(lat1) * Math.sin(lat2) -
        Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);

    var bear = radians2degrees * Math.atan2(a, b);

    return bear;
}




        



/**

     * @param lat1 - The latitude of the first position
     * @param lng1 - The longitude of the first position
     * @param lat2 - The latitude of the second position
     * @param lng2 - The longitude of the second position
     *
     * @return int - The bearing between 0 and 360
     */
      function bng(lat1,lng1,lat2,lng2) {
        var dLon = (lng2-lng1);
        var y = Math.sin(dLon) * Math.cos(lat2);
        var x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
        var brng = _toDeg(Math.atan2(y, x));
        return 360 - ((brng + 360) % 360);
    }

     *
