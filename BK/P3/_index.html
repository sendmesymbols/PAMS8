         function addToMap(evt) {
          var symbol;
          toolbar.deactivate();
          map.showZoomSlider();
          switch (evt.geometry.type) {
            case "point":
            case "multipoint":
              symbol = new SimpleMarkerSymbol();
              symbol = textSymbol;

            case "polyline":
              symbol = new SimpleLineSymbol();

            default:

          var graphic = new Graphic(evt.geometry, symbol);
          graphicsLayer.add(graphic);
          isDrawing = false;
