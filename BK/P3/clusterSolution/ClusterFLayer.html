        var dojoConfig = {
            paths: {

        'dojo/domReady!'

        parser, ready, arrayUtils, Color, domStyle, query,
        Map, esriRequest, Graphic, Extent,
        SimpleMarkerSymbol, SimpleLineSymbol, SimpleFillSymbol, PictureMarkerSymbol, ClassBreaksRenderer,SimpleRenderer, ArcGISTiledMapServiceLayer,

        ClusterFeatureLayer

          parser.parse();

          var clusterLayer;

            'markerSymbol': new SimpleMarkerSymbol('circle', 20, null, new Color([0, 0, 0, 0.25])),
            'marginLeft': '20',
            'marginTop': '20'
          };

                    logo: false,
                    showAttribution: false

           var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer/");
            map.addLayer(tiled);

          map.on('load', function() {
            // hide the popup's ZoomTo link as it doesn't make sense for cluster features
            domStyle.set(query('a.action.zoomTo')[0], 'display', 'none');
            addClusters();
          });

            var popupTemplate = PopupTemplate({

              }, {

                visible: true

            clusterLayer = new ClusterFeatureLayer({
              'url': 'http://services.arcgis.com/V6ZHFr6zdgNZuVG0/arcgis/rest/services/CensusLaborDemo/FeatureServer/1',
              'distance': 100,
              'id': 'clusters',
              'data' : cData,
              'labelColor': '#fff',
              'resolution': map.extent.getWidth() / map.width,
              'singleColor': '#888',
              'singleTemplate': popupTemplate,
              'singleRenderer' : new SimpleRenderer(),
              'useDefaultSymbol': false,
              'zoomOnClick': false
            });
            var picBaseUrl = '';
            var defaultSym = new PictureMarkerSymbol(picBaseUrl + 'BluePin1LargeB.png', 32, 32).setOffset(0, 15);
            var renderer = new ClassBreaksRenderer(defaultSym, 'clusterCount');
            var sls = SimpleLineSymbol;
            var sms = SimpleMarkerSymbol;

            var small = new sms('circle', 20,
                        new sls(sls.STYLE_SOLID, new Color([255,191,0,0.25]), 15),
                        new Color([255,191,0,0.5]));

            var medium = new sms('circle', 30,
                                      new sls(sls.STYLE_SOLID, new Color([148,0,211,0.25]), 15),
                                      new Color([148,0,211,0.5]));
            var large = new sms('circle', 50,
                        new sls(sls.STYLE_SOLID, new Color([255,0,0,0.25]), 15),
                        new Color([255,0,0,0.5]));

            renderer.addBreak(2, 10, small);
            renderer.addBreak(10, 25, medium);
            renderer.addBreak(25, 5000, large);

            // Providing a ClassBreakRenderer is also optional
            //clusterLayer.setRenderer(renderer);
            map.addLayer(clusterLayer);

            // close the info window when the map is clicked
            map.on('click', cleanUp);
            // close the info window when esc is pressed
            map.on('key-down', function(e) {
              if (e.keyCode === 27) {
                cleanUp();
              }
            });
          }

          function cleanUp() {
            map.infoWindow.hide();
            clusterLayer.clearSingles();
          }

          function error(err) {
            console.log('something failed: ', err);
          }

          // show cluster extents...
          // never called directly but useful from the console 
          window.showExtents = function() {
            var extents = map.getLayer('clusterExtents');
            if ( extents ) {
              map.removeLayer(extents);
            }
            extents = new GraphicsLayer({ id: 'clusterExtents' });
            var sym = new SimpleFillSymbol().setColor(new Color([205, 193, 197, 0.5]));

            arrayUtils.forEach(clusterLayer._clusters, function(c, idx) {
              var e = c.attributes.extent;
              extents.add(new Graphic(new Extent(e[0], e[1], e[2], e[3], map.spatialReference), sym));
            }, this);
            map.addLayer(extents, 0);
          }
        });
      });
    </script>
  </head>
  <body>
    <div data-dojo-type="dijit/layout/BorderContainer"
         data-dojo-props="design:'headline',gutters:false"

           data-dojo-type="dijit/layout/ContentPane"
           data-dojo-props="region:'center'">
      </div>
