    <script>  
     var map, tb, editor, sfs, sms;
    var hashbucket = [];

  
  
      require([  
        "esri/map", "esri/geometry/Polyline", "esri/symbols/SimpleLineSymbol",  
        "esri/graphic", "esri/layers/GraphicsLayer", "esri/layers/ArcGISTiledMapServiceLayer", 
        "esri/geometry/Extent", "esri/geometry/webMercatorUtils",  "MilSymbologyExt/GeoTools",

        "esri/symbols/SimpleFillSymbol", "esri/symbols/SimpleLineSymbol", "esri/Color", "esri/toolbars/draw","esri/toolbars/edit",
        "esri/geometry/geometryEngine", "esri/geometry/Point", "esri/symbols/SimpleMarkerSymbol","esri/SpatialReference",


        "dojo/dom", "dojo/dom-attr", "dojo/domReady!"  
      ], function(  
        Map, Polyline, SimpleLineSymbol,  
        Graphic, GraphicsLayer,  ArcGISTiledMapServiceLayer, Extent, webMercatorUtils, GeoTools,
        SimpleFillSymbol, SimpleLineSymbol, Color, Draw, Edit, geometryEngine, Point, SimpleMarkerSymbol, SpatialReference,
        dom, domAttr  
      ) {  
        map = new Map("map", {
          slider: false,  
          zoom: 2  
        });  


        var tiled = new ArcGISTiledMapServiceLayer("http://20.60.201.157:6080/arcgis/rest/services/Pak_OSM/MapServer");
         map.addLayer(tiled);
        
      sfs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID,
                new Color([50,50,50, 0.80]), 2),new Color([200,200,200,.05])
              );
    
    map.on("extent-change", function(evt) {
      map.graphics.clear();

      var precision = 0.1;

      createFishNets(map.extent, precision);
    });

    
    
    function createFishNets(extent, precision) {

      var fishNetSymbol = new SimpleLineSymbol().setColor(new Color([200,200,200, 0.5]));

      var upperLeftPoint;
      var lowerRightPoint;

      upperLeftPoint = new Point(extent.xmin, extent.ymax);
      lowerRightPoint = new Point(extent.xmax, extent.ymin);


      var mapXMin = Math.floor(upperLeftPoint.x, precision);
      var mapXMax = Math.ceil(lowerRightPoint.x, precision);
      var mapYMin = Math.floor(lowerRightPoint.y, precision);
      var mapYMax = Math.ceil(upperLeftPoint.y, precision); 


      
      mapXMin = parseFloat(mapXMin);
      mapYMax = parseFloat(mapYMax);
      mapXMax = parseFloat(mapXMax);
      mapYMin = parseFloat(mapYMin);
      precision = parseFloat(precision);

      var fishNets = [];

      for (var x = mapXMin + precision / 2; x < mapXMax; x = x + precision) {
                var singlePathPolylineVertical = new Polyline();
                singlePathPolylineVertical.addPath([[x, mapYMin], [x, mapYMax]]);
                debugger;
                var graphic = new esri.Graphic(singlePathPolylineVertical, fishNetSymbol);
                map.graphics.add(graphic);

                fishNets.push(singlePathPolylineVertical);

            }
            for (var y = mapYMin + precision/2; y < mapYMax; y = y + precision) {
                var singlePathPolylineHoriz = new Polyline();
                singlePathPolylineHoriz.addPath([[mapXMin, y], [mapXMax, y]]);

                debugger;

                var graphic = new esri.Graphic(singlePathPolylineHoriz, fishNetSymbol);
                map.graphics.add(graphic);

                fishNets.push(singlePathPolylineHoriz);
            }

            return fishNets;
    }


    });

    </script>
