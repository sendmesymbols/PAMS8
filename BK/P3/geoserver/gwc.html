<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title>GWC</title>

    <style>
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; } 
      #map { padding:0; } 
      #citationInfo { position:absolute; color:black; font-weight:bold; font-size:12pt; left:10px; bottom:10px; z-Index:999; }
    </style>
    <link rel="stylesheet" href="http://localhost:9632/3.15/dijit/themes/nihilo/nihilo.css">
    <link rel="stylesheet" href="http://localhost:9632/3.15/esri/css/esri.css">

    <script src="http://localhost:9632/3.15/init.js"></script>

    <script>
      var map, wmtsLayer;
      require([
        "esri/map", "esri/layers/WMTSLayer", "esri/layers/WMTSLayerInfo",
        "esri/geometry/Extent", "esri/layers/TileInfo", "esri/SpatialReference","esri/layers/WMSLayer",
        "dojo/parser",
        
        "dijit/layout/BorderContainer", "dijit/layout/ContentPane", "dojo/domReady!"
      ], function(
        Map, WMTSLayer, WMTSLayerInfo,
        Extent, TileInfo, SpatialReference, WMSLayer,
        parser
      ) {
        parser.parse();
        esri.config.defaults.io.proxyUrl = 'http://20.60.201.20:8080';

        
        var bounds = new Extent({
          "xmin": 32.35578102990007, "ymin": -0.6782409823499438, "xmax": 114.98412769010008, "ymax": 46.366139375350066,
          "spatialReference": { "wkid": 4326 }
        });
        map = new Map("map", {
          extent: bounds
        });

        var tileInfo1 = new TileInfo({
          "dpi": 90.71428571428571,
          "format": "image/png",
          "compressionQuality": 0,
          "spatialReference": new SpatialReference({
            "wkid": 4326
          }),
          "rows": 256,
          "cols": 256,
          "origin": {
            "x": 32,
            "y": 70
          },
          "lods": [{
            "level": "EPSG:900913:8",
            "scale": 2183915.0935581755,
            "resolution": 611.4962261962892
          }, {
            "level": "EPSG:900913:9",
            "scale": 1091957.5467790877,
            "resolution": 305.7481130981446
          }, {
            "level": "EPSG:900913:10",
            "scale": 545978.7733895439,
            "resolution": 152.8740565490723
          }, {
            "level": "EPSG:900913:11",
            "scale": 272989.38669477194,
            "resolution": 76.43702827453615
          }, {
            "level": "EPSG:900913:12",
            "scale": 136494.69334738597,
            "resolution": 38.21851413726807
          }, {
            "level": "EPSG:900913:13",
            "scale": 68247.34667369298,
            "resolution": 19.109257068634037
          }, {

            "level": "EPSG:900913:14",
            "scale": 34123.67333684649,
            "resolution": 9.554628534317018
          }, {

            "level": "EPSG:900913:15",
            "scale": 17061.836668423246,
            "resolution": 4.777314267158509
          }, {
            "level": "EPSG:900913:16",
            "scale": 8530.918334211623,
            "resolution": 2.3886571335792546
          }, {
            "level": "EPSG:900913:17",
            "scale": 4265.4591671058115,
            "resolution": 1.1943285667896273
          }, {
            "level": "EPSG:900913:18",
            "scale": 2132.7295835529058,
            "resolution": 0.5971642833948136
          }, {
            "level": "EPSG:900913:19",
            "scale": 1066.3647917764529,
            "resolution": 0.2985821416974068
          }]
        });
        var tileExtent1 = new Extent(32.35578102990007,-0.6782409823499438,114.98412769010008,46.366139375350066, new SpatialReference({
          wkid: 4326
        }));
        var layerInfo1 = new WMTSLayerInfo({
          tileInfo: tileInfo1,
          fullExtent: tileExtent1,
          initialExtent: tileExtent1,
          identifier: "PakMap",
          tileMatrixSet: "EPSG:0_PakMap",
          format: "png",
          style: "_null"
        });

       
        var resourceInfo = {
          version: "1.0.0",
          layerInfos: [layerInfo1],
          copyright: "open layer"
        };

        var options = {
          serviceMode: "KVP",
          resourceInfo: resourceInfo,
          layerInfo: layerInfo1
        };

        wmtsLayer = new WMTSLayer("http://20.60.201.20:8080/geoserver/gwc/service/wmts", options);
        map.addLayer(wmtsLayer);



        var wms = new WMSLayer('http://20.60.201.20:8080/geoserver/gwc/service/wmts');
        map.addLayer(wms);
      });

    </script>
  </head>
  
  <body>
    <div data-dojo-type="dijit/layout/BorderContainer" 
         data-dojo-props="design:'headline', gutters:false" 
         style="width: 100%; height: 100%; margin: 0;">

      <div id="map" 
           data-dojo-type="dijit/layout/ContentPane" 
           data-dojo-props="region:'center'">
        <div id="citationInfo">
          Served From Geo Web Cache
        </div>
      </div>

    </div>
  </body>
</html>
