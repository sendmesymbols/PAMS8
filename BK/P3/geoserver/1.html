        function AddA(WMSLayer,WMSLayerInfo,Extent) {  
            var layer10 = new WMSLayerInfo({name:"nurc:Img_Sample",title:"NO Quads"});           
            var resourceInfo10 = {  
                extent: new Extent(-130.85168,20.7052,-62.0054,54.1141,{wkid: 4326}),  
                layerInfos: [layer10],  
                version:"1.1.1"  
            };  
            var wmsLayer10 = new WMSLayer("http://arb-pc2:9512/geoserver/nurc/wms?service=WMS&version=1.1.0&request=GetCapabilities",  
                    {resourceInfo: resourceInfo10,  
                        visibleLayers: ["nurc:Img_Sample"]  
                    }  
            );  
  
           map.addLayers([wmsLayer10]);
