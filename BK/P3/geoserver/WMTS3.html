<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title>Add WMTS Layer</title>

    <style>
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; } 
      #map { padding:0; } 
      #citationInfo { position:absolute; color:black; font-weight:bold; font-size:12pt; left:10px; bottom:10px; z-Index:999; }

     <link rel="stylesheet" href="http://localhost:9632/3.15/dijit/themes/nihilo/nihilo.css">
     <link rel="stylesheet" href="http://localhost:9632/3.15/esri/css/esri.css">

    <script src="http://localhost:9632/3.15/init.js"></script>
    <script>
      var map, wmtsLayer;
      require([
        "esri/map", "esri/layers/WMTSLayer", "esri/layers/WMTSLayerInfo","esri/layers/ArcGISTiledMapServiceLayer",,
        "esri/geometry/Extent", "esri/layers/TileInfo", "esri/SpatialReference",
        "dojo/parser",
        
        "dijit/layout/BorderContainer", "dijit/layout/ContentPane", "dojo/domReady!"
      ], function(
        Map, WMTSLayer, WMTSLayerInfo, ArcGISTiledMapServiceLayer,
        Extent, TileInfo, SpatialReference,
        parser
      ) {
        parser.parse();

 
        var bounds = new Extent(36.11161496900007, 1.4862712700000316, 111.22829375100008, 43.82602261900007, new SpatialReference({
            wkid: 4326
        }));


        map = new Map("map", {
          extent: bounds
        });


        var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/MapData/MapServer");
        map.addLayer(tiled);
        tiled.setOpacity(0.3);

          },

          }, {

            "resolution": 0.011897305029151402
          }, {

            "level": "EPSG:900913:6",

          }, {

            "resolution": 3.807137609328448E-5
          }]
        });
        var tileExtent1 = bounds;

        var layerInfo1 = new WMTSLayerInfo({
          tileInfo: tileInfo1,
          fullExtent: tileExtent1,
          initialExtent: tileExtent1,
          identifier: "pak_osm",
          tileMatrixSet: "EPSG:4326_pak_osm",
          format: "jpeg",
          style: "_null"
        });       

        var resourceInfo = {
          version: "1.1.0",
          layerInfos: [layerInfo1],
          copyright: "GWC"
        };

        var options = {
          serviceMode: "KVP",
          resourceInfo: resourceInfo,
          layerInfo: layerInfo1
        };

        wmtsLayer = new WMTSLayer("http://localhost:9632/geowebcache/service/wmts", options);
        map.addLayer(wmtsLayer);
      });

    </script>
  </head>
  
  <body>
    <div data-dojo-type="dijit/layout/BorderContainer" 
         data-dojo-props="design:'headline', gutters:false"
