<!DOCTYPE html>  
<html>  
<head>  
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">  
    <!--The viewport meta tag is used to improve the presentation and behavior of the samples  
       on iOS devices-->  
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">  
    <title>Map with WMS</title>  
  
    <link rel="stylesheet" href="http://arb-pc2:9632/3.15/dijit/themes/nihilo/nihilo.css">
    <link rel="stylesheet" href="http://arb-pc2:9632/3.15/esri/css/esri.css">
    <style>  
        html, body, #map {  
            height: 100%;  
            width: 100%;  
            margin: 0;  
            padding: 0;  
        }  
        body {  
            background-color: #FFF;  
            overflow: hidden;  
            font-family: "Trebuchet MS";  
        }  
    </style>  
    <script src="http://arb-pc2:9632/3.15/init.js"></script>
  
    <script>  
        var map;  
  
        require(["esri/map", "esri/layers/WMSLayer", "esri/layers/WMTSLayer", "esri/config","esri/layers/WMSLayerInfo", "esri/layers/WMTSLayerInfo",
          "esri/geometry/Extent","esri/layers/FeatureLayer", "esri/layers/ArcGISTiledMapServiceLayer", 
          "esri/layers/ArcGISDynamicMapServiceLayer", "esri/basemaps", "esri/layers/WebTiledLayer"],  
                function(Map, WMSLayer, WMTSLayer, esriConfig, WMSLayerInfo, WMTSLayerInfo, Extent,FeatureLayer,
                  ArcGISTiledMapServiceLayer, ArcGISDynamicMapServiceLayer, 
                  basemaps, WebTiledLayer) { 
                  esri.config.defaults.io.corsEnabledServers.push('20.60.201.241:9512') 

                  var map = new Map("map");
                  /*
                  var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer");
                  map.addLayer(tiled);
                  */




                  var wmtsLayerInfo = new WMTSLayerInfo({
                    identifier: "tiger:giant_polygon",
                    tileMatrixSet: "GlobalCRS84Scale",
                    format: "png"
                  });

                  var options = {
                    serviceMode : "KVP",
                    layerInfo: wmtsLayerInfo
                  }

                  var wmtsLayer = new WMTSLayer("http://20.60.201.241:9512/geoserver/gwc/service/wmts", options);
                  map.addLayer(wmtsLayer);











                    
                });  
  
  





            
  
  
    </script>  
</head>  
  
<body>  
<div id="map">  
</div>  
</body>  
</html>
