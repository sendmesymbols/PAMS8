<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title>Create web map from id</title>

	
	<link rel="stylesheet" href="http://localhost:9632/3.15/dijit/themes/nihilo/nihilo.css">
	<link rel="stylesheet" href="http://localhost:9632/3.15/esri/css/esri.css">
	
	<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="css/AddLayers.css">
	<style>
	  html,body {
		height:100%;
		width:100%;
		margin:0;
		padding:0;
	  }

	  body {
		background-color:#FFF;
		overflow:hidden;
		font-family:"Helvetica";
	  }

	  .roundedCorners {
		-o-border-radius:4px;
		-moz-border-radius:4px;
		-webkit-border-radius:4px;
		border-radius:4px;
	  }

	  .shadow {
		-webkit-box-shadow:4px 4px 8px #adadad;
		-moz-box-shadow:4px 4px 8px #adadad;
		-o-box-shadow:4px 4px 8px #adadad;
		box-shadow:4px 4px 8px #adadad;
	  }
	  #rightPane{
		background-color:#E8E8E8;
		border:solid 2px #B8B8B8;
		margin:5px; 
		width:520px;
	  }
	  #map {
		background-color:#FFF;
		border:solid 2px #B8B8B8;
		margin:5px;
		padding:0;
  }
	</style>


<script type="text/javascript">
    var dojoConfig = {
      paths: {
        appl: location.origin + "/" + "P3/geoserver/test/js"
      }
    };
  </script>



	<script src="./js/jquery.min.js"></script>
	<script src="./js/bootstrap.min.js"></script>
	<script src="http://localhost:9632/3.15/init.js"></script>
    <script>
      require([
        "dojo/parser",
        "dojo/ready",
        "dijit/layout/BorderContainer",
        "dijit/layout/ContentPane",
        "dojo/dom",
		"appl/AddLayers",
        "esri/map", 
		"esri/layers/ArcGISTiledMapServiceLayer",
        "dojo/domReady!"
      ], function(
        parser,
        ready,
        BorderContainer,
        ContentPane,
        dom,
		AddLayers,
        Map,
		ArcGISTiledMapServiceLayer
      ) {

        parser.parse();
		
		var map = new Map("map");

		var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/MapData/MapServer");
		map.addLayer(tiled);

		esri.config.defaults.io.proxyUrl = "http://20.60.201.20:8080";



		
		map.on("load", function() {
			var addLayers = new AddLayers({
				map: map
			}, "addLayers");
			addLayers.startup();
		});

       });
    </script>
  </head>

  <body class="claro">
    <div id="mainWindow" data-dojo-type="dijit/layout/BorderContainer" data-dojo-props="design:'headline'" style="width:100%; height:100%;">
      <div id="map" class="roundedCorners shadow" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'center'"></div>
      <div id="rightPane" class="roundedCorners shadow" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'right'" >
        <div id="addLayers"></div>
      </div>
    </div>
  </body>
</html>
