<!DOCTYPE html>  
<html>  
<head>

    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">  
    <title>Map with WMS</title>  
  
    <link rel="stylesheet" href="http://localhost:9632/3.15/dijit/themes/nihilo/nihilo.css">
    <link rel="stylesheet" href="http://localhost:9632/3.15/esri/css/esri.css">
    <style>  
        html, body, #map {  
            height: 100%;  
            width: 100%;  
            margin: 0;  
            padding: 0;

        body {  
            background-color: #FFF;

    <script src="http://localhost:9632/3.15/init.js"></script>
  
    <script>  
  var map;

require(["esri/map", "esri/layers/WMSLayer", "esri/layers/WMTSLayer", "esri/config", "esri/layers/WMSLayerInfo", "esri/layers/WMTSLayerInfo", "esri/layers/TileInfo",
    "esri/geometry/Extent", "esri/layers/FeatureLayer", "esri/layers/ArcGISTiledMapServiceLayer",
    "esri/layers/ArcGISDynamicMapServiceLayer", "esri/basemaps", "esri/layers/WebTiledLayer", "esri/SpatialReference"],
    function (Map, WMSLayer, WMTSLayer, esriConfig, WMSLayerInfo, WMTSLayerInfo, TileInfo, Extent, FeatureLayer,
        ArcGISTiledMapServiceLayer, ArcGISDynamicMapServiceLayer,
        basemaps, WebTiledLayer, SpatialReference) {
        esri.config.defaults.io.corsEnabledServers.push('20.60.201.241:9512')

        var map = new Map("map");
        
        //var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer");
        //map.addLayer(tiled);
        


        var tileInfo1 = new TileInfo({
            "dpi": 96,
            "format": "image/png",
            "compressionQuality": 0,
            "spatialReference": new SpatialReference({
                "wkid": 4326
            }),
            "rows": 256,
            "cols": 256,
            "origin": {
                "x": 73.2,
                "y": 33.5
            },
            "lods": [{
                "level": "PindiIslamabad:0",
                "scale": 587715.1062046575,
                "resolution": 0.0014782696953124
            }, {
                "level": "PindiIslamabad:1",
                "scale": 293857.55310232873,
                "resolution": 0.0007391348476562
            }, {
                "level": "PindiIslamabad:2",
                "scale": 146928.77655116437,
                "resolution": 0.0003695674238281
            }, {
                "level": "PindiIslamabad:3",
                "scale": 73464.38827556229,
                "resolution": 0.000184783711914
            }]
        });

        /*
            "lods": [{
                "level": "PindiIslamabad:0",
                "scale": 591657527.591555,
                "resolution": 156543.03392800014
            }, {
                "level": "PindiIslamabad:1",
                "scale": 295828763.79577702,
                "resolution": 78271.516963999937
            }, {
                "level": "PindiIslamabad:2",
                "scale": 147914381.89788899,
                "resolution": 39135.758482000092
            }, {
                "level": "PindiIslamabad:3",
                "scale": 73957190.948944002,
                "resolution": 19567.879240999919
            }, {
                "level": "PindiIslamabad:4",
                "scale": 36978595.474472001,
                "resolution": 9783.9396204999593
            }]*/


        //var tileExtent1 = new Extent(15458931.4659706, 2701989.00905778, 15477712.7689042, 2711695.89036901, new SpatialReference({
        // wkid: 3857
        //}));
        var tileExtent1 = new Extent(73.15582711242676,33.47498797241222,73.25043614990233,33.55349097930918, new SpatialReference({
            wkid: 4326
        }));

        var layerInfo1 = new WMTSLayerInfo({
            tileInfo: tileInfo1,
            fullExtent: tileExtent1,
            initialExtent: tileExtent1,
            identifier: "rwp:google_rwp",
            tileMatrixSet: "PindiIslamabad",
            style: "_null",
            format: "png"
        });


        var resourceInfo = {
            version: "1.0.0",
            layerInfos: [layerInfo1],
            copyright: "open layer"
        };

        var options = {
            serviceMode: "KVP",
            resourceInfo: resourceInfo,
            layerInfo: layerInfo1
        };

        wmtsLayer = new WMTSLayer("http://localhost:9512/geoserver/gwc/service/wmts", options);
        map.addLayer(wmtsLayer);
    });
 
    </script>  
</head>  
  
<body>  
<div id="map">
