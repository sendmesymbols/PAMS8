<!DOCTYPE html>  
<html>  
<head>

    <title>Add WMS Layer</title>  
  
    <link rel="stylesheet" href="http://localhost:9632/3.15/dijit/themes/nihilo/nihilo.css">
    <link rel="stylesheet" href="http://localhost:9632/3.15/esri/css/esri.css">
    <style>  
        html, body, #map {  
            height: 100%;  
            width: 100%;  
            margin: 0;  
            padding: 0;  
        }  
        body {  
            background-color: #FFF;  
            overflow: hidden;  
            font-family: "Trebuchet MS";
        }

    <script src="http://localhost:9632/3.15/init.js"></script>
  
    <script>  
  var map;

require(["esri/map", "esri/layers/WMSLayer", "esri/layers/WMTSLayer", "esri/config", "esri/layers/WMSLayerInfo", "esri/layers/WMTSLayerInfo", "esri/layers/TileInfo",
    "esri/geometry/Extent", "esri/layers/FeatureLayer", "esri/layers/ArcGISTiledMapServiceLayer",
    "esri/layers/ArcGISDynamicMapServiceLayer", "esri/basemaps", "esri/layers/WebTiledLayer", "esri/SpatialReference"],
    function (Map, WMSLayer, WMTSLayer, esriConfig, WMSLayerInfo, WMTSLayerInfo, TileInfo, Extent, FeatureLayer,
        ArcGISTiledMapServiceLayer, ArcGISDynamicMapServiceLayer,
        basemaps, WebTiledLayer, SpatialReference) {
        esri.config.defaults.io.corsEnabledServers.push('20.60.201.241:9512')

        var map = new Map("map");        
        var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.24:6080/arcgis/rest/services/MapData/MapServer");
        //map.addLayer(tiled);
        //tiled.setOpacity(0.3);

            var layer10 = new WMSLayerInfo({name:"EPSG:4326_pak_osm",title:"Pak OSM"});           
            var resourceInfo10 = {  
                extent: new Extent(53.613426268148544,28.619299588076007,85.85194805190412,40.03710938648944,{wkid: 4326}),  
                layerInfos: [layer10],  
                version:"1.1.1"  
            };



            var wmsLayer10 = new WMSLayer("http://devbox:9632/geowebcache/service/wms?SERVICE=WMSVERSION=1.1.1&REQUEST=GetMap&LAYERS=pak_osm&SRS=EPSG:4326",
                    {
                      resourceInfo: resourceInfo10,
                        visibleLayers: ["pak_osm"]  
                    }  
            );  
            //wmsLayer10.setOpacity(0.4);         
  
            map.addLayers([wmsLayer10]);  

            



        
    });
 
    </script>  
</head>  
  
<body>  
<div id="map">  
</div>  
</body>
