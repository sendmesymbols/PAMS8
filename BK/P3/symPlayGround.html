        function createArc (startPt, endPt, bPt, radius) {

    		angle = angle + 360;

	  			}
		
  			return pts;

      function createPL (dx, dy, dr, sp) {
      var pts = [];
      pts = createDD(dx,dy+(dr/2),dr/2,sp);
      pts.push(new Point(dx-((dr/2)/3), dy, sp));
      pts.push(new Point(dx-((dr/2)/3), dy-dr, sp));

      
      return [pts, createL(dx+(dr*0.7), dy, dr, sp)];
    	}


    function createL (dx, dy, dr, sp) {
      var pts = [];
      pts.push(new Point(dx, dy-dr, sp));     
      pts.push(new Point(dx, dy+dr, sp));

      pts.push(new Point(dx, dy-dr, sp));
      pts.push(new Point(dx+dr, dy-dr, sp));

      return pts;
    }


     function createDD(dx, dy, dr, sp) {
      var pts = [];
      var step = 2*Math.PI / 180;

      
      pts.push(new Point(dx-(dr/3), dy+dr, sp));
      pts.push(new Point(dx, dy+dr, sp));     
      
      for(var dtheta = 270*Math.PI/180;  dtheta < 360*Math.PI/180;  dtheta+=step)  { 
        var x = dx + dr*Math.cos(dtheta);
        var y = dy - dr*Math.sin(dtheta);   
        pts.push(new Point(x,y,sp));
      }     
      
      for(var dtheta = 0*Math.PI/180;  dtheta < 91*Math.PI/180;  dtheta+=step)  { 
        var x = dx + dr*Math.cos(dtheta);
        var y = dy - dr*Math.sin(dtheta);    
        pts.push(new Point(x,y,sp));
      }
      
      
      pts.push(new Point(dx-(dr/3), dy-dr, sp));
      pts.push(new Point(dx, dy-dr, sp));
          
      
      pts.push(new Point(dx-(dr/3), dy-dr, sp));
      pts.push(new Point(dx-(dr/3), dy+dr, sp));
      
      return pts;
    }

          function getDashPts(pts,dashArray) {
            var result = []; 

            for (var j = 0; j < pts.length; j++) {
                p1 = pts[j];
              if(pts[j+1] != undefined) {
                p2 = pts[j+1];
                 result = result.concat(dashes(p1.x, p1.y, p2.x, p2.y, dashArray ));

                }
             }


            return result;

            function dashes(x,y,x2,y2,dashArray) {
            var x,y;
            var points = [];

              if (!dashArray) dashArray=[10,5];
              if (dashLength===0) dashLength = 0.001; // Hack for Safari
              var dashCount = dashArray.length;
              points.push(new Point(x, y));
              var dx = (x2-x), dy = (y2-y);
              var slope = dx ? dy/dx : 1e15;
              var distRemaining = Math.sqrt( dx*dx + dy*dy );
              var dashIndex=0, draw=true;
              while (distRemaining>=0.1){
                var dashLength = dashArray[dashIndex++%dashCount];
                if (dashLength > distRemaining) dashLength = distRemaining;
                var xStep = Math.sqrt( dashLength*dashLength / (1 + slope*slope) );
                if (dx<0) xStep = -xStep;
                x += xStep;
                y += slope*xStep;
                points.push(new Point(x, y));
                distRemaining -= dashLength;
                draw = !draw;
              }
              return points;
            }




           function createG (dx, dy, dr, sp) {
