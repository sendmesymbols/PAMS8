<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title>SimpleMarkerSymbol with SVG Path - Simplified</title>
    <link rel="stylesheet" href="http://arb-pc2:9632/3.14/dijit/themes/nihilo/nihilo.css">
    <link rel="stylesheet" href="http://arb-pc2:9632/3.14/esri/css/esri.css">
    <style>
      html, body, #map {
        height:100%;
        width:100%;
        margin:0;
        padding:0;
      }
      .blurInfo {
      position: absolute;
      top: 10px;
      right: 5px;
      font-size: 1.25em;
      font-family: monospace;
      color: #4C4C4C;
      width: 240px;
      background-color: #FFFFFF;
      padding: 10px;
      border: 2px solid #57585A;
      border-radius: 20px;
    }

    .blurInfo p span {
      background-color: #FFFFFF;
      padding: 0 5px;
      border-radius: 5px;
    }

    .blurInfo input[type=range] {
      width: 100%;
      display: block;
    }
      
    </style>
       <script src="http://arb-pc2:9632/MilitarySymbology/ThirdParty/tween.js"></script>
    <script src="http://arb-pc2:9632/MilitarySymbology/ThirdParty/turf.min.js"></script>
    <script src="http://arb-pc2:9632/MilitarySymbology/ThirdParty/milsymbol.js"></script>
    <script type="text/javascript">
       var dojoConfig = {
            paths: {
              MilSymbologyExt: location.origin + "/" + "MilitarySymbology/Extensions",
              MilSymbologyComponents: location.origin + "/" + "MilitarySymbology/Components",
              MilSymbologySymbols: location.origin + "/" + "MilitarySymbology/Symbols",
              MilSymbologySymbolsEngine: location.origin + "/" + "MilitarySymbology/Engines",
              MilSymbologySymbolsData: location.origin + "/" + "MilitarySymbology/Data",
              MilSymbologySymbolsImages: location.origin + "/" + "MilitarySymbology/Images"
              }
            };


     
    </script>
     <script src="http://arb-pc2:9632/3.15/init.js"></script>
    <script>
   var map;
   var heatMapLayer;

    require([
        "esri/InfoTemplate",
        "esri/layers/FeatureLayer",
        "esri/map",
        "esri/renderers/HeatmapRenderer",
        "esri/tasks/FeatureSet",
        "esri/geometry/Point",
        "esri/symbols/SimpleMarkerSymbol",
        "esri/Color",
        "esri/graphic",
        "esri/SpatialReference",
        "esri/layers/ArcGISTiledMapServiceLayer",
        "MilSymbologyExt/GeoTools",
        "dojo/domReady!"
      ],
      function(InfoTemplate, FeatureLayer, Map, HeatmapRenderer, FeatureSet, Point, SimpleMarkerSymbol, Color, Graphic, SpatialReference, ArcGISTiledMapServiceLayer, GeoTools) {



        map = new Map("map", {});

        var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer");
        map.addLayer(tiled);

        var features = [];
       
        var spatialReference = new SpatialReference(4326);
        var pt, attr, graphic;
        
        var sms = new SimpleMarkerSymbol().setStyle(
          SimpleMarkerSymbol.STYLE_SQUARE).setColor(
          new Color([255, 0, 0, 0.5]));

        pt = new Point(73, 33, spatialReference);
                  
        attr = {
          OBJECTID: 1,
          text: 'a',
          magnitude: 1000,
          x: -80.12,
          y: 40.42
        }

        graphic = new Graphic(pt, sms, attr);


        features.push(graphic);

        pt = new Point(71.2545, 30.2212, spatialReference);

        attr = {
          OBJECTID: 2,
          text: 'b',
          magnitude: 100,
          x: -81.12,
          y: 40.42
        }

        graphic = new Graphic(pt, sms, attr);
        features.push(graphic);

        pt = new Point(72.6646, 31.15454, spatialReference);
        
        attr = {
          OBJECTID: 3,
          text: 'C',
          magnitude: 200,
          x: -81.12,
          y: 41.42
        }

        graphic = new Graphic(pt, sms, attr);

        features.push(graphic);

        pt = new Point(72.6659, 31.94, spatialReference);
        
        attr = {
          OBJECTID: 4,
          text: 'D',
          magnitude: 200,
          x: -81.12,
          y: 41.42
        }

        graphic = new Graphic(pt, sms, attr);

        features.push(graphic);

        var blurCtrl = document.getElementById("blurControl");
        var maxCtrl = document.getElementById("maxControl");
        var minCtrl = document.getElementById("minControl");

        var colorBtn = document.getElementById("colorBtn");
        

        heatMapLayer = GeoTools.getHeatMapLayer(features, 'magnitude', minCtrl.value, maxCtrl.value, blurCtrl.value);
        map.addLayer(heatMapLayer);
        


        /** Add event handlers for interactivity **/
        var sliders = document.querySelectorAll(".blurInfo p~input[type=range]");
        var addLiveValue = function (ctrl){
          var val = ctrl.previousElementSibling.querySelector("span");
          ctrl.addEventListener("input", function (evt){
            val.innerHTML = evt.target.value;
          });
        };
        for (var i = 0; i < sliders.length; i++) {
          addLiveValue(sliders.item(i));
        }

        blurCtrl.addEventListener("change", function (evt){
          
          var r = +evt.target.value;
          if (r !== heatMapLayer.renderer.blurRadius) {
            heatMapLayer.renderer.blurRadius = r;
            heatMapLayer.redraw();
          }
        });
        maxCtrl.addEventListener("change", function (evt){
          var r = +evt.target.value;
          if (r !== heatMapLayer.renderer.maxPixelIntensity) {
            heatMapLayer.renderer.maxPixelIntensity = r;
            heatMapLayer.redraw();
          }
        });
        minCtrl.addEventListener("change", function (evt){
          var r = +evt.target.value;

          if (r !== heatMapLayer.renderer.minPixelIntensity) {
            heatMapLayer.renderer.minPixelIntensity = r;


          heatMapLayer.renderer.colorStops = colorStops = [
          {ratio: 0, color: 'rgba(0,255,0,0)'},
          {ratio: 0.6, color: 'rgb(0,255,0)'},
          {ratio: 0.85, color: 'rgb(0,150,0)'},
          {ratio: 0.95, color: 'rgb(0,255,0)'},
          ]


            heatMapLayer.redraw();
          }
        });


          colorBtn.addEventListener("click", function (evt){
          
           heatMapLayer.renderer.setColorStops([
          {ratio: 0, color: 'rgba(0,255,255,0)'},
          {ratio: 0.6, color: 'rgb(0,255,255)'},
          {ratio: 0.85, color: 'rgb(0,150,255)'},
          {ratio: 0.95, color: 'rgb(0,255,255)'},
          ]);
          heatMapLayer.redraw();
          
        });


        
 


        
      })

    </script>
  </head>
  <body class="claro">
 

    <div id="map">
      
     


    </div>


      <div class="blurInfo">
    <p>
      <label for="valueControl">Weight by magnitude</label>
      <input id="valueControl" type="checkbox" checked>
    </p>
    <p>Blur Radius : <span id="blurValue">10</span></p>
    <input id="blurControl" type="range" max=100 min=0 value=10 step=1/>

    <p>Max Value : <span id="maxValue">100</span></p>
    <input id="maxControl" type="range" max=500 min=0 value=100 step=1/>

    <p>Min Value : <span id="minValue">0</span></p>
    <input id="minControl" type="range" max=500 min=0 value=0 step=1/>



    <p>Change Color : </p>
    <input type="button" value="Change Color" name="changeColor" id="colorBtn">
  </div>

  </body>
</html>
