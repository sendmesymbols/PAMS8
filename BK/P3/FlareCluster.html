        .menu-hamburger {
            position: relative;
            display: inline-block;

            height: 0.8em;
            margin-right: 0.3em;
            border-top: 0.2em solid #fff;
            border-bottom: 0.2em solid #fff;
            cursor: pointer;
        }

        .menu-hamburger:before {
            content: "";
            position: absolute;
            top: 0.3em;
            left: 0px;
            width: 100%;
            border-top: 0.2em solid #fff;
        }

        #close-menu {
            cursor: pointer;
            position: absolute;
            right: 5px;
            top: 0;
            font-size: 1.5em;
        }

        .esriSimpleSliderTL {
            top: 60px;
            right: 20px;

    <script type="text/javascript">

        var map;
        var graphics;
        

       //set some defaults
        var preClustered = false;
        var displaySingleFlaresAtCount = 10;
        var areaDisplayMode = "hover";
        var cLayer = [];

        require(["esri/map", "esri/layers/GraphicsLayer", "esri/graphic", "esri/dijit/PopupTemplate", 
            "MilSymbologyExt/ClusterLayer", "MilSymbologySymbolsThirdParty/DataManager",
               "esri/symbols/SimpleMarkerSymbol", "esri/symbols/SimpleLineSymbol", "esri/symbols/SimpleFillSymbol", "esri/renderers/ClassBreaksRenderer",
                "esri/layers/ArcGISTiledMapServiceLayer",
                "dojo/ready", "dojo/json", "dojo/dom", "dojo/on", "dojo/text!./data.json"],
        function (Map, GraphicsLayer, Graphic, PopupTemplate, ClusterLayer, DataManager, SimpleMarkerSymbol, SimpleLineSymbol, SimpleFillSymbol, ClassBreaksRenderer, ArcGISTiledMapServiceLayer, ready, JSON, dom, on, data) {

            //load up the dummy data
            var allData = JSON.parse(data);
            DataManager.setData(allData);

            ready(function () {

                document.getElementById("clustering-mode").value = preClustered ? "server" : "client";
                document.getElementById("area-mode").value = areaDisplayMode;


                document.getElementById("deActivateBtn").onclick = dest;


                

                 map = new Map("map", {
                    logo: false,
                    showAttribution: false                    
                });

                var tiled = new ArcGISTiledMapServiceLayer("http://20.60.50.22:6080/arcgis/rest/services/OSM_Tiled/MapServer/");
                map.addLayer(tiled);

                 map.on("load", function () {
                   var options = {};
                   options.areaDisplayMode = "hover";
                   options.clusterRatio = 75;
                   //options.areaDisplayMode = "always" || "hover" || "";
                   var template = new PopupTemplate({
                    title: "{name}",
                    fieldInfos: [
                      { fieldName: "facilityType", label: "Facility Type", visible: true },
                      { fieldName: "postcode", label: "Post Code", visible: true },
                      { fieldName: "isOpen", label: "Opening Hours", visible: true }
                    ]
                    });


                    
                    options.template = template;

                    cLayer = new ClusterLayer(map, DataManager, "facilityType", options);

                    console.log(cLayer.getLayer());

                    cLayer.activate();



                });


                 function dest() {
                    cLayer.deActivate();
                 }


                                  

                             
            
        })
        });


    </script>

<body>

    <div id="map">

        <div id="header">
            <span id="menu-switch" class="menu-hamburger" title="Show/hide options"></span>
            <span>Cluster layer</span>
            
        </div>

        <div id="menu" >
            <span id="close-menu" title="Hide options">&times</span>
            <div><label for="clustering-mode">Clustering mode:</label></div>
            <div>
                <select id="clustering-mode">
                    <option value="server">Fake server side</option>
                    <option value="client">Client side</option>
                </select>
            </div>

            <hr />
            <div><label for="area-mode">Display cluster area mode:</label></div>
            <div>
                <select id="area-mode">
                    <option value="">None</option>
                    <option value="hover">Hover</option>
                    <option value="always">Always</option>
                </select>
                <br />
                <input type="button" value="Deactivate" id="deActivateBtn">
            </div>
        </div>

    </div>

</body>
