        function addIntoExtent(extent, geometry, isFirst) {

          var resExtent = new Extent();
          if (extent !== null || extent !== undefined) {
            if (isFirst) {
              if (geometry.type === 'point') {
                var newExtent = new Extent();
                newExtent.setSpatialReference(extent.spatialReference);

                newExtent.xmin = geometry.x;
                newExtent.xmax = geometry.x;

                newExtent.ymin = geometry.y;
                newExtent.ymax = geometry.y;

                resExtent = newExtent;
              }
              if (geometry.type === 'polygon' || geometry.type === 'polyline') {
                var t = geometry.getExtent();
                if (t !== undefined) {
                  resExtent = t;
                }

              }

            } else {
              if (geometry.type === 'point')
                resExtent = extent.union({
                  'xmin': geometry.x,
                  'ymin': geometry.y,
                  'xmax': geometry.x,
                  'ymax': geometry.y
                });
              if (geometry.type === 'polygon' || geometry.type === 'polyline') {
                var s = geometry.getExtent();
                if (s !== undefined) {
                  resExtent = extent.union(s);
                }


              }

            }


            return resExtent;
          }
        }

        function zoomGeom(map, graphicsLayer, textGraphicsLayer, event) {
          if (graphicsLayer.graphics.length > 0) {
            var extent = new Extent();
            extent.setSpatialReference(map.spatialReference);
            extent = addIntoExtent(extent, graphicsLayer.graphics[0].geometry, true);
            for (var i = graphicsLayer.graphics.length - 1; i >= 1; i--) {
              extent = addIntoExtent(extent, graphicsLayer.graphics[i].geometry);
            }



            map.setExtent(extent.expand(1.5));




            var SnappingManager = map.enableSnapping({
              snapKey: has("mac") ? keys.META : keys.CTRL
            });

          }




        }

        function addIntoExtent(extent, geometry, isFirst) {
          var resExtent = new Extent();

          if (isFirst) {
            if (geometry.type === 'point') {
              var p = new Polyline();
              p.setSpatialReference(geometry.spatialReference);
              p.addPath([geometry, geometry]);
              resExtent = p.getExtent();
            }
            if (geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = geometry.getExtent();
          } else {
            if (geometry.type === 'point') resExtent = extent.union({ 'xmin': geometry.x, 'ymin': geometry.y, 'xmax': geometry.x, 'ymax': geometry.y });
            if (geometry.type === 'polygon' || geometry.type === 'polyline') resExtent = extent.union(geometry.getExtent());
          }


          return resExtent;
        }

        //////////////////////////////////////////////////////////////////////////////////////////////////////////////Measurement Engine



      // function to calculate and provide a bearing for the points being drawn.  Code provided by Dean Anderson of Polk County, OR
      function _getBearing(point_a, point_b) {
        var bearing = '-';
        if(point_a && point_b) {
          var bearing = 'N0-0-0E';
    
          var rise = point_b.y - point_a.y;
          var run = point_b.x - point_a.x;
          if(rise == 0) {
            if(point_a.x > point_b.x) {
              bearing = 'Due West';
            } else {
              bearing = 'Due East';
            }
          } else if(run == 0) {
            if(point_a.y > point_b.y) {
              bearing = 'Due South';
            } else {
              bearing = 'Due North';
            }
          } else {
            var ns_quad = 'N';
            var ew_quad = 'E';
            if(rise < 0) {
              ns_quad = 'S';
            }
            if(run < 0) {
              ew_quad = 'W';
            }
            /* we've determined the quadrant, so we can make these absolute */
            rise = Math.abs(rise);
            run = Math.abs(run);
            /* convert to degrees */
            // var degrees = Math.atan(rise/run) / (2*Math.PI) * 360;
            // Calculation suggested by Dean Anderson, refs: #153
            var degrees = Math.atan(run/rise) / (2*Math.PI) * 360;
    
            /* and to DMS ... */
            var d = parseInt(degrees);
            var t = (degrees - d) * 60;
            var m = parseInt(t);
            var s = parseInt(60 * (t-m));
    
            bearing = ns_quad+d+'-'+m+'-'+s+ew_quad;
    
          }
        }
        return bearing;
      }


        /***
        * meters | feet | kilometers | miles | nautical-miles | yards
        **/

        function _calculateSegmentLength(pt1, pt2, unit, useGeodesic) {
          var pl = new Polyline(pt1.spatialReference);
          pl.addPath([pt1, pt2]);
          // we want the last point being drawn
          var geoLength = 0;
          if (useGeodesic === true) {
            geoLength = geometryEngine.geodesicLength(pl, unit);
          } else {
            geoLength = geometryEngine.planarLength(pl, unit);
          }

          return geoLength;
        }

        /***
        * meters | feet | kilometers | miles | nautical-miles | yards
        **/
        function _calculatePolylineLength(pl, unit, useGeodesic) {
          // we want the last point being drawn

          var geoLength = 0;
          if (useGeodesic === true) {
            geoLength = geometryEngine.geodesicLength(pl, unit);
          } else {
            geoLength = geometryEngine.planarLength(pl, unit);
          } return geoLength;
        }

        /***
        * acres | ares | hectares | square-feet | square-meters | square-yards | square-kilometers | square-miles
        **/
        function _calculateArea(geometry, unit, useGeodesic) {
          var geoArea = 0;
          if (useGeodesic === true) {
            geoArea = geometryEngine.geodesicArea(geometry, unit);
          } else {
            geoArea = geometryEngine.planarArea(geometry, unit);
          } return geoArea;
        }

        function _reorderGraphics(measureLayer) {
          // text for measurements needs to be on type all others
          var graArray = [];
          // make 2 pass through the graphics in the measure array move text to the top.
          // second pass adds text graphics
          for (var i = 0; i < measureLayer.graphics.length; i++) {
            var gra = measureLayer.graphics[i];
            if (gra.symbol.type === 'textsymbol') {
              graArray.push(gra);
            }
          }
          // first pass adds non text graphics
          for (var i = 0; i < measureLayer.graphics.length; i++) {
            var gra = measureLayer.graphics[i];
            if (gra.symbol.type !== 'textsymbol') {
              graArray.push(gra);
            }
          }
          measureLayer.graphics = graArray;
          measureLayer.redraw();

          console.log('R');
        }
       

        function getMeasureSymbol(pt, angle, length) {
          var a = Font.STYLE_ITALIC;
          var b = Font.VARIANT_NORMAL;
          var c = Font.WEIGHT_BOLD;
          var symbolFont = new Font(12 + "px", a, b, c, "Courier");
          var fontColor = new Color([255, 0, 0]);
          var textSymbol = new TextSymbol(length, symbolFont, fontColor);
          var xOff = 0;
          var yOff = 0;
          if (angle >= 0 && angle < 45) {
            xOff = 5;
            yOff = 10;
          } else if (angle > 45) {
            xOff = 10;
            yOff = 5;
          } else if (angle > -45 && angle < 0) {
            xOff = 5;
            yOff = 13;
          } else {
            xOff = -10;
            yOff = 5;
          }
          textSymbol.setOffset(xOff, yOff);
          textSymbol.setAngle(angle);
          return textSymbol;
        }

        function _addClickMeasure(pt, angle, length) {
          var a = Font.STYLE_ITALIC;
          var b = Font.VARIANT_NORMAL;
          var c = Font.WEIGHT_BOLD;
          var symbolFont = new Font(20 + "px", a, b, c, "Courier");
          var fontColor = new Color([255, 0, 0]);
          var textSymbol = new TextSymbol(length, symbolFont, fontColor);
          var xOff = 0;
          var yOff = 0;
          if (angle >= 0 && angle < 45) {
            xOff = 5;
            yOff = 10;
          } else if (angle > 45) {
            xOff = 10;
            yOff = 5;
          } else if (angle > -45 && angle < 0) {
            xOff = 5;
            yOff = 13;
          } else {
            xOff = -10;
            yOff = 5;
          }
          textSymbol.setOffset(xOff, yOff);
          textSymbol.setAngle(angle);
          // console.log("angle: " + angle);
          var att = { 'id': '10000' };
          var gra = new Graphic(pt, textSymbol, att, null);
          measurementGraphicsLayer.add(gra);
        }

        function _getBearing(point_a, point_b) {
          var bearing = '-';
          if (point_a && point_b) {
            var bearing = 'N0-0-0E';

            var rise = point_b.y - point_a.y;
            var run = point_b.x - point_a.x;
            if (rise == 0) {
              if (point_a.x > point_b.x) {
                bearing = 'Due West';
              } else {
                bearing = 'Due East';
              }
            } else if (run == 0) {
              if (point_a.y > point_b.y) {
                bearing = 'Due South';
              } else {
                bearing = 'Due North';
              }
            } else {
              var ns_quad = 'N';
              var ew_quad = 'E';
              if (rise < 0) {
                ns_quad = 'S';
              }
              if (run < 0) {
                ew_quad = 'W';
              }
              /* we've determined the quadrant, so we can make these absolute */
              rise = Math.abs(rise);
              run = Math.abs(run);
              /* convert to degrees */
              // var degrees = Math.atan(rise/run) / (2*Math.PI) * 360;
              // Calculation suggested by Dean Anderson, refs: #153
              var degrees = Math.atan(run / rise) / (2 * Math.PI) * 360;

              /* and to DMS ... */
              var d = parseInt(degrees);
              var t = (degrees - d) * 60;
              var m = parseInt(t);
              var s = parseInt(60 * (t - m));

              bearing = ns_quad + d + '-' + m + '-' + s + ew_quad;

            }
          }
          return bearing;
        }



        function _calculateAngle(pt1, pt2) {
          // some basic trig to calculate the angle for the text to be placed
          var y = pt2.y - pt1.y;
          var x = pt2.x - pt1.x;
          var r = y / x;
          var angle = Math.atan(r) * 180 / Math.PI * -1;
          return angle;
        }


        function _calculateMidPoint(pt1, pt2) {
          var midX = (pt1.x + pt2.x) / 2;
          var midY = (pt1.y + pt2.y) / 2;
          var midPoint = new Point(midX, midY, pt1.spatialReference);
          return midPoint;
        }
