            if(!isDrawing) {

            editEngine.activateEdit(evt.graphic);
          }

           function createGraphicsMenu() {
          // Creates right-click context menu for GRAPHICS
          ctxMenuForGraphics = new Menu({});
          ctxMenuForGraphics.addChild(new MenuItem({
            label: "Edit",
            onClick: function() {
              if ( selected.geometry.type !== "point" ) {
                if(!isDrawing) {
                   editEngine.activateEdit(selected);
               }
                 
              }
            }
          }));

          
          ctxMenuForGraphics.addChild(new MenuItem({
            label: "Style",
            onClick: function() {
              alert("Not implemented");
            }
          }));

          ctxMenuForGraphics.addChild(new MenuSeparator());
          
          ctxMenuForGraphics.addChild(new MenuItem({
            label: "Edit Control Points",
            onClick: function() {
              if(selected.geometry.type === "point") {
                editEngine.activateEdit(selected);   
              } else {
                editEngine.activateEditPts(selected);   
              }
            
            }
          }));


            
           ctxMenuForGraphics.addChild(new MenuItem({
            label: "Disable Edit Control Points",
            onClick: function() {
            editEngine.deactivateEditPts(graphicsLayer);
             }
          }));

            console.info("Geometry");

              console.log(JSON.stringify(selected.geometry.paths));
            }  else if(selected.geometry.type ==="polygon") {

            } else if(selected.geometry.type ==="point") {
              console.log(JSON.stringify(selected.geometry));
            }

            console.log(JSON.stringify(selected.drawEssentials.CTRL_PTS));

            console.log(JSON.stringify(selected.drawEssentials.BASE_LN_PTS));

            if(selected.geometry.type ==="polyline") {
              dojo.byId("geoText").value = JSON.stringify(selected.geometry.paths);
            }  else if(selected.geometry.type ==="polygon") {
              dojo.byId("geoText").value = JSON.stringify(selected.geometry.rings);
            } else if(selected.geometry.type ==="point") {
              dojo.byId("geoText").value = JSON.stringify(selected.geometry);
            }
            
            dojo.byId("ctrlPtsText").value = JSON.stringify(selected.drawEssentials.CTRL_PTS);
            dojo.byId("baseLinePtsText").value = JSON.stringify(selected.drawEssentials.BASE_LN_PTS);






            }
          }));


          ctxMenuForGraphics.startup();
