<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />

<title>Dead Ground Mapper — Fully Fixed</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css"/>

<style>
html,body,#viewDiv{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  font-family:monospace;
}

#panel{
  position:absolute;
  top:10px;
  right:10px;
  z-index:100;
  width:320px;
  background:rgba(0,0,0,.92);
  border:1px solid #DC3C30;
  color:#ddd;
  padding:12px;
}

#panel h2{
  margin:0 0 10px;
  color:#DC3C30;
  font-size:14px;
}

label{
  display:block;
  margin-top:8px;
  font-size:11px;
}

input,select,button{
  width:100%;
  margin-top:4px;
  padding:6px;
  box-sizing:border-box;
  background:#111;
  color:#ddd;
  border:1px solid #444;
}

button{
  cursor:pointer;
  border-color:#DC3C30;
}

button:hover{
  background:#222;
}

#status{
  margin-top:10px;
  color:#DC3C30;
  font-size:11px;
}

#progress{
  width:100%;
  height:6px;
  background:#222;
  margin-top:8px;
}

#progressFill{
  width:0%;
  height:100%;
  background:#DC3C30;
}

#stats{
  margin-top:10px;
  line-height:1.6;
  font-size:11px;
}
</style>
</head>

<body>

<div id="viewDiv"></div>

<div id="panel">

<h2>Dead Ground Mapper</h2>

<label>Eye Height (m)</label>
<input id="eyeHeight" type="number" value="1.8"/>

<label>Analysis Radius (m)</label>
<input id="radius" type="number" value="3000"/>

<label>Cell Size (m)</label>
<select id="cellSize">
  <option value="20">20 (slow)</option>
  <option value="35" selected>35 (balanced)</option>
  <option value="50">50 (fast)</option>
  <option value="80">80 (preview)</option>
</select>

<label>Maximum Depth (m)</label>
<input id="maxDepth" type="number" value="50"/>

<label>Opacity</label>
<input id="opacity" type="number" step="0.05" value="0.75"/>

<label>
<input id="showVisible" type="checkbox"/>
Show visible terrain
</label>

<label>
<input id="showMesh" type="checkbox" checked/>
Show 3D mesh
</label>

<button id="runBtn" disabled>Run Analysis</button>
<button id="clearBtn">Clear</button>

<div id="status">Click map to place observer</div>

<div id="progress">
<div id="progressFill"></div>
</div>

<div id="stats">
<div>Dead Ground: <span id="deadPct">—</span></div>
<div>Maximum Depth: <span id="depthStat">—</span></div>
<div>Cells: <span id="cellStat">—</span></div>
</div>

</div>

<script src="https://js.arcgis.com/4.28/"></script>

<script>
require([
  "esri/Map",
  "esri/views/SceneView",
  "esri/layers/GraphicsLayer",
  "esri/layers/MediaLayer",
  "esri/layers/support/ImageElement",
  "esri/layers/support/ExtentAndRotationGeoreference",
  "esri/Graphic",
  "esri/geometry/Point",
  "esri/geometry/Extent",
  "esri/geometry/Mesh"
], function(
  ArcGISMap,
  SceneView,
  GraphicsLayer,
  MediaLayer,
  ImageElement,
  ExtentAndRotationGeoreference,
  Graphic,
  Point,
  Extent,
  Mesh
){

const INVALID = -9999;
const M_PER_DEG = 111320;
const EARTH_R = 6371008.8;

function $(id){
  return document.getElementById(id);
}

function setStatus(text){
  $("status").textContent = text;
}

function setProgress(v){
  $("progressFill").style.width = (v*100) + "%";
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function destPt(lon,lat,bearingDeg,distM){

  const δ = distM / EARTH_R;
  const θ = bearingDeg * Math.PI / 180;

  const φ1 = lat * Math.PI / 180;
  const λ1 = lon * Math.PI / 180;

  const φ2 = Math.asin(
    Math.sin(φ1)*Math.cos(δ) +
    Math.cos(φ1)*Math.sin(δ)*Math.cos(θ)
  );

  const λ2 = λ1 + Math.atan2(
    Math.sin(θ)*Math.sin(δ)*Math.cos(φ1),
    Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2)
  );

  return {
    longitude: λ2 * 180 / Math.PI,
    latitude: φ2 * 180 / Math.PI
  };
}

function depthColor(depth,maxDepth,opacity){

  const t = Math.min(1, depth / maxDepth);

  const r = Math.round(140 + (245-140)*t);
  const g = Math.round(28 + (240-28)*t);
  const b = Math.round(28 + (64-28)*t);

  return [
    r,
    g,
    b,
    Math.round(opacity*255)
  ];
}

const meshLayer = new GraphicsLayer();
const observerLayer = new GraphicsLayer();

const map = new ArcGISMap({
  basemap:"satellite",
  ground:"world-elevation",
  layers:[meshLayer,observerLayer]
});

const view = new SceneView({
  container:"viewDiv",
  map,
  camera:{
    position:{
      longitude:73.06,
      latitude:33.68,
      z:12000
    },
    tilt:50
  }
});

let observerPt = null;
let observerZ = 0;
let heatmapLayer = null;
let running = false;

view.on("click", async(event)=>{

  if(running) return;

  observerLayer.removeAll();

  observerPt = event.mapPoint.clone();

  observerLayer.add(new Graphic({
    geometry:observerPt,
    symbol:{
      type:"simple-marker",
      color:[0,180,255],
      size:10
    }
  }));

  $("runBtn").disabled = false;

  setStatus("Observer placed");
});

async function safeElevation(sampler,lon,lat){

  try{

    const sample = sampler.queryElevation(
      new Point({
        longitude:lon,
        latitude:lat,
        spatialReference:{wkid:4326}
      })
    );

    return Number.isFinite(sample?.z)
      ? sample.z
      : 0;

  }catch{
    return 0;
  }
}

async function computeDeadGround(params){

  const {
    radiusM,
    cellM,
    eyeH
  } = params;

  const safeCosLat = Math.max(
    0.01,
    Math.abs(Math.cos(observerPt.latitude*Math.PI/180))
  );

  const extent = new Extent({
    xmin:observerPt.longitude-radiusM/(M_PER_DEG*safeCosLat),
    ymin:observerPt.latitude-radiusM/M_PER_DEG,
    xmax:observerPt.longitude+radiusM/(M_PER_DEG*safeCosLat),
    ymax:observerPt.latitude+radiusM/M_PER_DEG,
    spatialReference:{wkid:4326}
  });

  setStatus("Loading terrain...");

  const sampler =
    await view.map.ground.createElevationSampler(extent);

  try{

    const elev =
      await view.map.ground.queryElevation(observerPt);

    observerZ =
      (Number.isFinite(elev?.geometry?.z)
        ? elev.geometry.z
        : 0)
      + eyeH;

  }catch{
    observerZ = eyeH;
  }

  const cols = Math.ceil((radiusM*2)/cellM);
  const rows = cols;

  const grid = new Float32Array(cols*rows);
  grid.fill(INVALID);

  let validCells = 0;
  let deadCells = 0;
  let deepest = 0;

  const STEP_M = Math.max(10, cellM*0.5);

  const horizonCache = new Map();

  async function getHorizon(bearing,targetRange){

    const key =
      `${Math.round(bearing)}_${Math.round(targetRange/STEP_M)}`;

    if(horizonCache.has(key)){
      return horizonCache.get(key);
    }

    let maxSlope = -90;

    for(let d=STEP_M; d<=targetRange; d+=STEP_M){

      const p = destPt(
        observerPt.longitude,
        observerPt.latitude,
        bearing,
        d
      );

      const z =
        await safeElevation(
          sampler,
          p.longitude,
          p.latitude
        );

      const slope =
        Math.atan2(z-observerZ,d)*180/Math.PI;

      if(slope > maxSlope){
        maxSlope = slope;
      }
    }

    horizonCache.set(key,maxSlope);

    return maxSlope;
  }

  for(let row=0; row<rows; row++){

    for(let col=0; col<cols; col++){

      const east =
        (col-cols/2+0.5)*cellM;

      const north =
        (row-rows/2+0.5)*cellM;

      const range =
        Math.sqrt(east*east+north*north);

      const idx = row*cols+col;

      if(range > radiusM || range < 1){
        continue;
      }

      validCells++;

      const lon =
        observerPt.longitude +
        east/(M_PER_DEG*safeCosLat);

      const lat =
        observerPt.latitude +
        north/M_PER_DEG;

      const terrainZ =
        await safeElevation(sampler,lon,lat);

      const bearing =
        Math.atan2(east,north)*180/Math.PI;

      const horizon =
        await getHorizon(bearing,range);

      const losZ =
        observerZ +
        range*Math.tan(horizon*Math.PI/180);

      const depth =
        losZ - terrainZ;

      grid[idx] = depth;

      if(depth > 0){

        deadCells++;

        if(depth > deepest){
          deepest = depth;
        }
      }
    }

    if(row % 4 === 0){

      setProgress(row/rows);

      await sleep(0);
    }
  }

  return {
    grid,
    cols,
    rows,
    extent,
    deepest,
    deadPct:
      Math.round(
        100 * deadCells / Math.max(validCells,1)
      )
  };
}

function buildHeatmap(result,params){

  const {
    grid,
    cols,
    rows,
    extent
  } = result;

  const {
    maxDepth,
    opacity,
    showVisible
  } = params;

  const canvas =
    document.createElement("canvas");

  canvas.width = cols;
  canvas.height = rows;

  const ctx = canvas.getContext("2d");

  const img =
    ctx.createImageData(cols,rows);

  for(let i=0; i<grid.length; i++){

    const d = grid[i];
    const p = i*4;

    if(d === INVALID){

      img.data[p+3] = 0;
      continue;
    }

    if(d > 0){

      const rgba =
        depthColor(d,maxDepth,opacity);

      img.data[p] = rgba[0];
      img.data[p+1] = rgba[1];
      img.data[p+2] = rgba[2];
      img.data[p+3] = rgba[3];

    }else if(showVisible){

      img.data[p] = 0;
      img.data[p+1] = 255;
      img.data[p+2] = 0;
      img.data[p+3] = 50;

    }else{

      img.data[p+3] = 0;
    }
  }

  ctx.putImageData(img,0,0);

  const url = canvas.toDataURL();

  return new MediaLayer({
    source:[
      new ImageElement({
        image:url,
        georeference:
          new ExtentAndRotationGeoreference({
            extent
          })
      })
    ]
  });
}

async function buildMesh(result,params){

  const {
    grid,
    cols,
    rows,
    extent
  } = result;

  const {
    maxDepth,
    opacity,
    showVisible
  } = params;

  const sampler =
    await view.map.ground.createElevationSampler(extent);

  const dLon =
    (extent.xmax-extent.xmin)/cols;

  const dLat =
    (extent.ymax-extent.ymin)/rows;

  const positions =
    new Float64Array(cols*rows*3);

  const colors =
    new Uint8Array(cols*rows*4);

  for(let row=0; row<rows; row++){

    for(let col=0; col<cols; col++){

      const i = row*cols+col;

      const lon =
        extent.xmin + (col+0.5)*dLon;

      const lat =
        extent.ymax - (row+0.5)*dLat;

      const z =
        await safeElevation(sampler,lon,lat);

      positions[i*3] = lon;
      positions[i*3+1] = lat;
      positions[i*3+2] = z + 1;

      const d = grid[i];

      if(d === INVALID){

        colors[i*4+3] = 0;
        continue;
      }

      if(d > 0){

        const rgba =
          depthColor(d,maxDepth,opacity);

        colors[i*4] = rgba[0];
        colors[i*4+1] = rgba[1];
        colors[i*4+2] = rgba[2];
        colors[i*4+3] = rgba[3];

      }else if(showVisible){

        colors[i*4] = 0;
        colors[i*4+1] = 255;
        colors[i*4+2] = 0;
        colors[i*4+3] = 50;

      }else{

        colors[i*4+3] = 0;
      }
    }
  }

  const faces =
    new Uint32Array((cols-1)*(rows-1)*6);

  let fi = 0;

  for(let row=0; row<rows-1; row++){

    for(let col=0; col<cols-1; col++){

      const v00 = row*cols+col;
      const v10 = row*cols+col+1;
      const v01 = (row+1)*cols+col;
      const v11 = (row+1)*cols+col+1;

      faces[fi++] = v00;
      faces[fi++] = v10;
      faces[fi++] = v01;

      faces[fi++] = v10;
      faces[fi++] = v11;
      faces[fi++] = v01;
    }
  }

  const mesh = new Mesh({
    vertexAttributes:{
      position:positions,
      color:colors
    },
    components:[{
      faces
    }],
    spatialReference:{
      wkid:4326
    }
  });

  return new Graphic({
    geometry:mesh,
    symbol:{
      type:"mesh-3d",
      symbolLayers:[{
        type:"fill"
      }]
    }
  });
}

$("runBtn").addEventListener("click", async()=>{

  if(!observerPt || running) return;

  running = true;

  $("runBtn").disabled = true;

  try{

    meshLayer.removeAll();

    if(heatmapLayer){

      map.remove(heatmapLayer);
      heatmapLayer = null;
    }

    const params = {
      radiusM:parseFloat($("radius").value),
      cellM:parseFloat($("cellSize").value),
      eyeH:parseFloat($("eyeHeight").value),
      maxDepth:parseFloat($("maxDepth").value),
      opacity:parseFloat($("opacity").value),
      showVisible:$("showVisible").checked
    };

    setStatus("Computing dead ground...");

    const result =
      await computeDeadGround(params);

    setStatus("Rendering heatmap...");

    heatmapLayer =
      buildHeatmap(result,params);

    map.add(heatmapLayer);

    if($("showMesh").checked){

      setStatus("Building mesh...");

      const mesh =
        await buildMesh(result,params);

      meshLayer.add(mesh);
    }

    $("deadPct").textContent =
      result.deadPct + "%";

    $("depthStat").textContent =
      Math.round(result.deepest) + " m";

    $("cellStat").textContent =
      (result.cols*result.rows).toLocaleString();

    setProgress(1);

    setStatus("Done");

    view.goTo({
      target:result.extent,
      tilt:65
    });

  }catch(err){

    console.error(err);

    setStatus("Analysis failed");

  }finally{

    running = false;
    $("runBtn").disabled = false;
  }
});

$("clearBtn").addEventListener("click", ()=>{

  meshLayer.removeAll();
  observerLayer.removeAll();

  if(heatmapLayer){

    map.remove(heatmapLayer);
    heatmapLayer = null;
  }

  observerPt = null;

  $("runBtn").disabled = true;

  $("deadPct").textContent = "—";
  $("depthStat").textContent = "—";
  $("cellStat").textContent = "—";

  setProgress(0);

  setStatus("Click map to place observer");
});

view.when(()=>{
  console.log("Dead Ground Mapper Ready");
});

});
</script>

</body>
</html>
